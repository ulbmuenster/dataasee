# Language: Compose YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

name: "dataasee"

networks:
  persistence:
  application:

secrets:
  database:
    environment: "DB_PASS"
  datalake:
    environment: "DL_PASS"

volumes:
  backup:
    driver: "local"
    driver_opts:
      type: "none"
      o: "bind"
      device: "${DL_BACKUP-./backup}"

services:

## Database ####################################################################

  database:
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        IMGREPO: "${ORIGIN:-}"
        VERSION: "$DB_VERSION"
        DB_NAME: "$DB_NAME"
        DL_VERSION: "$DL_VERSION"
      context: "."
      dockerfile: "container/Dockerfile.db"
      tags:
        - "$REGISTRY/$DL_REPO/database:$DL_VERSION"
      # sbom: true
      target: "develop"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: "4G"
        reservations:
          cpus: "2.0"
          memory: "2G"
    environment:
      TZ: "${TZ-Europe/Berlin}"
      DB_PASS: "/run/secrets/database"
      DB_OPTS: ""
    image: "$REGISTRY/$DL_REPO/database:$DL_VERSION"
    init: true
    networks:
      - "persistence"
    ports:
      - "2480:2480"
      - "9999:9999"
    pull_policy: "never"
    restart: "unless-stopped"
    secrets:
      - "database"
    stop_grace_period: "200s"
    volumes:
      - "backup:/backup"

## Backend #####################################################################

  backend:
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        IMGREPO: "${ORIGIN:-}"
        VERSION: "$BE_VERSION"
        DL_NAME: "$DL_NAME"
        DL_VERSION: "$DL_VERSION"
        DL_PORT: "8343"
        DL_PATH: "$DL_PATH"
        DB_HOST: "database"
        DB_PORT: "2480"
        DB_NAME: "$DB_NAME"
      context: "."
      dockerfile: "container/Dockerfile.be"
      # sbom: true
      tags:
        - "$REGISTRY/$DL_REPO/backend:$DL_VERSION"
      target: "develop"
    depends_on:
      - "database"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "1.0"
          memory: "1G"
    environment:
      TZ: "${TZ-Europe/Berlin}"
      DL_BASE: "http://${DL_BASE-localhost}:${DL_PORT-8343}"
      DL_USER: "${DL_USER-admin}"
      DL_PASS: "/run/secrets/datalake"
      DB_PASS: "/run/secrets/database"
      DL_SAFE: "${DL_SAFE}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: "$REGISTRY/$DL_REPO/backend:$DL_VERSION"
    init: true
    networks:
      - "persistence"
      - "application"
    ports:
      - "${DL_PORT-8343}:8343"
    pull_policy: "never"
    restart: "unless-stopped"
    secrets:
      - "database"
      - "datalake"
    volumes:
      - "./backend:/yaml:ro"
      - "./api:/schemas:ro"

## Frontend ####################################################################

  frontend:
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        IMGREPO: "${ORIGIN:-}"
        VERSION: "$FE_VERSION"
        DL_HOST: "backend"
        DL_PORT: "8343"
        DL_PATH: "$DL_PATH"
        DL_VERSION: "$DL_VERSION"
      context: "."
      dockerfile: "container/Dockerfile.fe"
      # sbom: true
      tags:
        - "$REGISTRY/$DL_REPO/frontend:$DL_VERSION"
      target: "develop"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "1.0"
          memory: "1G"
    environment:
      TZ: "${TZ-Europe/Berlin}"
    image: "$REGISTRY/$DL_REPO/frontend:$DL_VERSION"
    init: true
    networks:
      - "application"
    ports:
      - "${FE_PORT-8000}:8000"
    pull_policy: "never"
    restart: "unless-stopped"
    volumes:
      - "./frontend:/yaml:ro"
