# Language: Lowdefy YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

# Results Card
id: "results_card"
type: "Card"
visible:
  _gt:
    - _array.length:
        _state: "results_list"
    - 0
areas:
  content:
    gutter: 16
    blocks:
## Results Title
      - id: "results_title"
        type: "Title"
        properties:
          content: "Results"
          level: 2
        layout:
          span: 6
## Results Metadata Legend
      - id: "results_legend"
        type: "Alert"
        properties:
          message: "🟩 (green) all mandatory and optional DataCite properties valid. 🟨 (yellow) mandatory DataCite properties valid. 🟥 (red) not all mandatatory DataCite properties valid."
          showIcon: false
        layout:
          span: 18
        style:
          text-align: "center"
## Results List
      - id: "results_list"
        type: "List"
        blocks:
          - id: "results_wrapper.$"
            type: "Tooltip"
            properties:
              title:
                _switch:
                  branches:
                    - if:
                        _eq:
                          - _string.toLowerCase:
                              _request: "search_request.data.data.$.attributes.metadataQuality"
                          - "ok"
                      then: "Metadata Quality: OK"
                    - if:
                        _eq:
                          - _string.toLowerCase:
                              _request: "search_request.data.data.$.attributes.metadataQuality"
                          - "good"
                      then: "Metadata Quality: Good"
                    - if:
                        _eq:
                          - _array.length:
                              _request: "search_request.data.data"
                          - 0
                      then: ""
                  default: "Metadata Quality: Incomplete"
            style:
              padding: "0.5%"
              background-color:
                _string.concat:
                  - _switch:
                      branches:
                        - if:
                            _eq:
                              - _string.toLowerCase:
                                  _request: "search_request.data.data.$.attributes.metadataQuality"
                              - "ok"
                          then:
                            _global: "warning"
                        - if:
                            _eq:
                              - _string.toLowerCase:
                                  _request: "search_request.data.data.$.attributes.metadataQuality"
                              - "good"
                          then:
                            _global: "success"
                        - if:
                            _eq:
                              - _array.length:
                                  _request: "search_request.data.data"
                              - 0
                          then:
                            _global: "special"
                      default:
                        _global: "error"
                  - "40"  # 75% Transparent
            blocks:
              - id: "results_list.$"
                type: "Anchor"
                layout:
                  span: 22
                properties:
                  href:
                    _state: "results_list.$.href"
                  strong: true
                  title:
                    _state: "results_list.$.title"

              - id: "results_doi.$"
                type: "Anchor"
                layout:
                  span: 2
                properties:
                  href:
                    _state: "results_list.$.doi"
                  newTab: true
                  strong: true
                  title: " → DOI"
                  style:
                    font-size: "large"
                    font-weight: "bold"
                visible:
                  _ne:
                    - _state: "results_list.$.doi"
                    - null
          - id: "results_div.$"
            type: "Divider"
## Results Paging  NOTE: the values are wrapped in objects because the ButtonSelector expects unique values among buttons.
      - id: "results_paging"
        type: "ButtonSelector"
        properties:
          options:
            - label: "<< First"
              value:
                type: "first"
                url:
                  _if_none:
                    - _request: "search_request.data.links.first"
                    - ""
              disabled:
                _eq:
                  - _request: "search_request.data.links.first"
                  - null
            - label: "< Prev"
              value:
                type: "prev"
                url:
                  _if_none:
                    - _request: "search_request.data.links.prev"
                    - ""
              disabled:
                _eq:
                  - _request: "search_request.data.links.prev"
                  - null
            - label: "Next >"
              value:
                type: "next"
                url:
                  _if_none:
                    - _request: "search_request.data.links.next"
                    - ""
              disabled:
                _eq:
                  - _request: "search_request.data.links.next"
                  - null
          label:
            disabled: true
        events:
          onChange:
            - id: "submit_query"
              type: "Request"
              params: "search_request"
            - _ref: "templates/update.yaml"
            - id: "clear_pager"
              type: "SetState"
              params:
                results_paging: ""
