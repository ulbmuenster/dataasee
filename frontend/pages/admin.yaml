# Language: Lowdefy YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

# Admin Panel
id: "admin"
type: "PageSiderMenu"
properties:
  title:
    _string.concat:
      - _global: "title"
      - " | Admin"
  header:
    color:
      _global: "color"
  logo:
    _global: "logo"

requests:
  - _ref: "templates/ready.yaml"

  - id: "ingest_schema_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    properties:
      url: "/api"
      method: "get"
      params:
        request: "ingest"

  - id: "health_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      username:
        _state: "username"
      password:
        _state: "password"
    properties:
      url: "/health"
      method: "post"
      auth:
        username:
          _payload: "username"
        password:
          _payload: "password"

  - id: "ingest_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      username:
        _state: "username"
      password:
        _state: "password"
      ingest_source:
        _state: "ingest_source"
      ingest_method:
        _state: "ingest_method"
      ingest_format:
        _state: "ingest_format"
      ingest_steward:
        _state: "ingest_steward"
      ingest_rights:
        _state: "ingest_rights"
      ingest_options:
        _state: "ingest_options"
      ingest_username:
        _state: "ingest_username"
      ingest_password:
        _state: "ingest_password"
    properties:
      url: "/ingest"
      method: "post"
      auth:
        username:
          _payload: "username"
        password:
          _payload: "password"
      data:
        _if:
          test:
            _and:
              - _not:
                  _payload: "ingest_source"
              - _not:
                  _payload: "ingest_method"
              - _not:
                  _payload: "ingest_format"
              - _not:
                  _payload: "ingest_steward"
              - _not:
                  _payload: "ingest_rights"
          then: null
          else:
            source:
              _payload: "ingest_source"
            method:
              _payload: "ingest_method"
            format:
              _payload: "ingest_format"
            rights:
              _payload: "ingest_rights"
            steward:
              _payload: "ingest_steward"
            options:
              _payload: "ingest_options"
            username:
              _payload: "ingest_username"
            password:
              _payload: "ingest_password"

events:
  onInit:
    - id: "ingest_enter"
      type: "Request"
      params: "ingest_schema_request"

  onMountAsync:
    - id: "ready_enter"
      type: "Request"
      params: "ready_request"

areas:
  content:
    gutter: 16
    blocks:
## Page Title
      - id: "heading"
        type: "Title"
        properties:
          content: "Admin Controls"
          type: "danger"
          level: 1
## Admin Card
      - id: "admin_card"
        type: "Card"
        areas:
          content:
            gutter: 16
            blocks:
## Left Column
              - id: "left"
                type: "Box"
                layout:
                  span: 12
                blocks:
## Ingest Card
                  - id: "ingest_card"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Ingest Source"
                      headerStyle:
                        font-size: "large"
                    areas:
                      content:
                        gutter: 16
                        blocks:
## Busy Button
                          - id: "busy_button"
                            type: "Button"
                            layout:
                              span: 13
                            properties:
                              block: true
                              title: "Ingesting?"
                              icon: "AiFillWarning"
                            events:
                              onClick:
                                - id: "ask_credentials"
                                  type: "CallMethod"
                                  params:
                                    blockId: "credentials_modal"
                                    method: "toggleOpen"
                                - id: "busy_click"
                                  type: "SetState"
                                  params:
                                    operation: "ingest_request"
                                - id: "busy_focus"
                                  type: "SetFocus"
                                  params: "username_input"
## Ingest Source
                          - id: "ingest_source"
                            type: "TextInput"
                            required: true
                            layout:
                              span: 12
                            properties:
                              placeholder: "Source URL"
                              label:
                                colon: false
                                disabled: true
## Ingest Method
                          - id: "ingest_method"
                            type: "Selector"
                            required: true
                            layout:
                              span: 12
                            properties:
                              label:
                                disabled: true
                              placeholder: "Method"
                              options:
                                _request: "ingest_schema_request.data.properties.method.enum"
## Ingest Rights
                          - id: "ingest_rights"
                            type: "TextInput"
                            required: true
                            layout:
                              span: 12
                            properties:
                              placeholder: "Source Rights"
                              label:
                                colon: false
                                disabled: true
## Ingest Format
                          - id: "ingest_format"
                            type: "Selector"
                            required: true
                            layout:
                              span: 12
                            properties:
                              label:
                                disabled: true
                              placeholder: "Format"
                              options:
                                _request: "ingest_schema_request.data.properties.format.enum"
## Ingest Steward
                          - id: "ingest_steward"
                            type: "TextInput"
                            required: true
                            layout:
                              span: 12
                            properties:
                              placeholder: "Data Steward"
                              label:
                                colon: false
                                disabled: true
## Ingest Options
                          - id: "ingest_options"
                            type: "TextInput"
                            required: true
                            layout:
                              span: 12
                            properties:
                              placeholder: "Source Options (OAI-PMH method only)"
                              label:
                                colon: false
                                disabled: true
## Ingest Credentials
                          - id: "ingest_username"
                            type: "PasswordInput"
                            layout:
                              span: 12
                            properties:
                              placeholder: "Access Key (S3 method only)"
                              label:
                                colon: false
                                disabled: true
                          - id: "ingest_password"
                            type: "PasswordInput"
                            layout:
                              span: 12
                            properties:
                              placeholder: "Secret Key (S3 method only)"
                              label:
                                colon: false
                                disabled: true
## Ingest Button
                          - id: "ingest_button"
                            type: "Button"
                            layout:
                              span: 13
                            properties:
                              block: true
                              title: "Ingest"
                              icon: "AiFillWarning"
                            events:
                              onClick:
                                - id: "ingest_validate"
                                  type: "Validate"
                                  params:
                                    - "ingest_source"
                                    - "ingest_method"
                                    - "ingest_rights"
                                    - "ingest_format"
                                    - "ingest_steward"
                                - id: "ask_credentials"
                                  type: "CallMethod"
                                  params:
                                    blockId: "credentials_modal"
                                    method: "toggleOpen"
                                - id: "ingest_click"
                                  type: "SetState"
                                  params:
                                    operation: "ingest_request"
                                - id: "ingest_focus"
                                  type: "SetFocus"
                                  params: "username_input"
                                - id: "ingest_stamp"
                                  type: "SetState"
                                  params:
                                    ingest_timestamp:
                                      _string.concat:
                                        - "Last Ingest: "
                                        - _date.toString:
                                            _date: "now"
## Ingest Banner
                          - id: "ingest_banner"
                            type: "Alert"
                            properties:
                              type:
                                _if:
                                  test:
                                    _request: "ingest_request.data.data.attributes.started"
                                  then:
                                    "warning"
                                  else:
                                    "success"
                              message:
                                _if:
                                  test:
                                    _request: "ingest_request.data.data.attributes.started"
                                  then:
                                    "Ingest Started (see logs for details)"
                                  else:
                                    "No Ingest Running"
                            visible:
                              _and:
                                - _request: "ingest_request.data.data.attributes"
## Ingest Time-Stamp
                          - id: "ingest_timestamp"
                            type: "TextInput"
                            properties:
                              bordered: false
                              label:
                                disabled: true
                            visible:
                              _eq:
                                - _state: "ingest_timestamp"
                                - ""
## Health Card
                  - id: "health_card"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Health Check"
                      headerStyle:
                        font-size: "large"
                    areas:
                      content:
                        gutter: 16
                        blocks:
## Health Button
                          - id: "health_button"
                            type: "Button"
                            layout:
                              span: 13
                            properties:
                              block: true
                              title: "Health"
                              icon: "AiFillWarning"
                            events:
                              onClick:
                                - id: "ask_credentials"
                                  type: "CallMethod"
                                  params:
                                    blockId: "credentials_modal"
                                    method: "toggleOpen"
                                - id: "health_click"
                                  type: "SetState"
                                  params:
                                    operation: "health_request"
                                - id: "health_focus"
                                  type: "SetFocus"
                                  params: "username_input"
                                - id: "health_stamp"
                                  type: "SetState"
                                  params:
                                    health_timestamp:
                                      _string.concat:
                                        - "Last Health Check: "
                                        - _date.toString:
                                            _date: "now"
## Health Processor Banner
                          - id: "processor_banner"
                            type: "Alert"
                            properties:
                              _if:
                                test:
                                  _if_none:
                                    - _request: "health_request.data.data.attributes.processor.healthy"
                                    - false
                                then:
                                  type: "success"
                                  message:
                                    _string.concat:
                                      - "Processor ("
                                      - _request: "health_request.data.data.attributes.processor.name"
                                      - " "
                                      - _request: "health_request.data.data.attributes.processor.version"
                                      - ")"
                                else:
                                  type: "error"
                                  message: "Processor (No Response)"
                            visible:
                              _not:
                                _type:
                                  type: "null"
                                  on:
                                    _request: "health_request.data"
## Health Processor Report
                          - id: "processor_report"
                            type: "Descriptions"
                            properties:
                              bordered: true
                              column: 1
                              itemOptions: []
                              items:
                                _array.map:
                                  on:
                                    _object.entries:
                                      _request: "health_request.data.data.attributes.processor.report"
                                  callback:
                                    _function:
                                      label:
                                        __get:
                                          from:
                                            __args: 0
                                          key: 0
                                      value:
                                        __get:
                                          from:
                                            __args: 0
                                          key: 1
                            visible:
                              _not:
                                _type:
                                  type: "null"
                                  on:
                                    _request: "health_request.data"
## Health Database Banner
                          - id: "database_banner"
                            type: "Alert"
                            properties:
                              _if:
                                test:
                                  _if_none:
                                    - _request: "health_request.data.data.attributes.database.healthy"
                                    - false
                                then:
                                  type: "success"
                                  message:
                                    _string.concat:
                                      - "Database ("
                                      - _request: "health_request.data.data.attributes.database.name"
                                      - " "
                                      - _request: "health_request.data.data.attributes.database.version"
                                      - ")"
                                else:
                                  type: "error"
                                  message: "Database (No Response)"
                            visible:
                              _not:
                                _type:
                                  type: "null"
                                  on:
                                    _request: "health_request.data"
## Health Database Report
                          - id: "database_report"
                            type: "Descriptions"
                            properties:
                              bordered: true
                              column: 1
                              itemOptions: []
                              items:
                                _array.map:
                                  on:
                                    _object.entries:
                                      _request: "health_request.data.data.attributes.database.report"
                                  callback:
                                    _function:
                                      label:
                                        __get:
                                          from:
                                            __args: 0
                                          key: 0
                                      value:
                                        __get:
                                          from:
                                            __args: 0
                                          key: 1
                            visible:
                              _not:
                                _type:
                                  type: "null"
                                  on:
                                    _request: "health_request.data"
## Health Time-Stamp
                          - id: "health_timestamp"
                            type: "TextInput"
                            properties:
                              bordered: false
                              label:
                                disabled: true
                            visible:
                              _not:
                                _type:
                                  type: "null"
                                  on:
                                    _request: "health_request.data"
## Right Column
              - id: "right"
                type: "Box"
                layout:
                  span: 12
                areas:
                  content:
                    gutter: 16
                    blocks:
                      - id: "admin_help"
                        type: "Card"
                        properties:
                          bordered: false
                          size: "small"
                          title: "Admin Help"
                          headerStyle:
                            font-size: "large"
                        blocks:
                          - id: "admin_md"
                            type: "Markdown"
                            properties:
                              content: |
                                The admin panel enables triggering maintenance tasks, each requiring authorization via a modal input box, such as:

                                * **Ingesting?**; returns whether or not an ingest is ongoing (concurrent ingests are not possible!).
                                * **Ingest**; returns succesfully if an ingest from the specified metadata source was started, using:
                                    - **Source URL** is an HTTP(S) URL of maximal 4095 characters (required).
                                    - **Method** is the protocol to be used for ingestion (required).
                                    - **Source Rights** is an identifier of the source metadata rights as a whole of maximal 4095 characters (required).
                                    - **Format** is the file format of the ingested metadata (required).
                                    - **Data Steward** is the responsible entity for the ingested metadata of maximal 4095 characters (required).
                                    - **Source Options** can be used to pass date or set constraints for selective harvesting (_only for OAI-PMH_).
                                    - **Access Key** (or username) for the source (_only for S3_).
                                    - **Secret Key** (or password) for the source (_only for S3_).
                                * **Health**; returns processor and database liveness, as well as database health stats.

                      - id: "admin_detail"
                        type: "Collapse"
                        properties:
                          defaultActiveKey: "none"
                          panels:
                            - key: "technically"
                              title: "Technically"
                        areas:
                          technically:
                            blocks:
                              - id: "technically"
                                type: "Markdown"
                                properties:
                                  content: |
                                    * An ingest is triggered by a POST request to:

                                      ```
                                      /api/v1/ingest
                                      ```
                                      With the `source`, `steward`, `rights`, `method`, `format`, `options`, `username`, `password` arguments in the (JSON) body.

                                    * A health check is triggered by a POST request to:

                                      ```
                                      /api/v1/health
                                      ```
## Username / Password Modal
      - id: "credentials_modal"
        type: "Modal"
        properties:
          title: "DatAasee Authorization"
          okText: "Submit"
        events:
          onClose:
            - id: "modal_clear"
              type: "SetState"
              params:
                password: ""
        areas:
          content:
            gutter: 16
            blocks:
              - id: "operation"
                type: "Selector"
                layout:
                  span: 16
                properties:
                  showArrow: false
                  label:
                    inline: true
                    title: "for"
                  disabled: true
                  options:
                    - label: "Ingest"
                      value: "ingest_request"
                    - label: "Health"
                      value: "health_request"
## Credentials
              - id: "username"
                type: "TextInput"
                required: true
                layout:
                  span: 16
                properties:
                  placeholder: "Username"
                  label:
                    colon: false
                    disabled: true
              - id: "password"
                type: "PasswordInput"
                required: true
                layout:
                  span: 16
                properties:
                  placeholder: "Password"
                  label:
                    colon: false
                    disabled: true
          footer:
            gutter: 16
            blocks:
              - id: "enter_button"  # Do not change! This name is needed to trigger by pressing "Enter"
                type: "Button"
                properties:
                  title: "Execute"
                  icon: "AiFillWarning"
                events:
                  onClick:
                    try:
                      - id: "modal_reset"
                        type: "ResetValidation"
                      - id: "modal_validate"
                        type: "Validate"
                        params:
                          - "username"
                          - "password"
                      - id: "modal_send"
                        type: "Request"
                        params:
                          _state: "operation"
                      - id: "modal_clear"
                        type: "SetState"
                        params:
                          username: ""
                          password: ""
                          ingest_source: ""
                          ingest_steward: ""
                          ingest_rights: ""
                          ingest_method: ""
                          ingest_format: ""
                          ingest_options: ""
                          ingest_username: ""
                          ingest_password: ""
                      - id: "ask_credentials"
                        type: "CallMethod"
                        params:
                          blockId: "credentials_modal"
                          method: "toggleOpen"
                      - id: "throw_cred"
                        type: "Throw"
                        params:
                          throw:
                            _eq:
                              - _request:
                                  _string.concat:
                                    - _state: "operation"
                                    - ".status"
                              - 403
                          message: "Credentials invalid"
                      - id: "throw_req"
                        type: "Throw"
                        params:
                          throw:
                            _eq:
                              - _request:
                                  _string.concat:
                                    - _state: "operation"
                                    - ".status"
                              - 400
                          message: "Request invalid"
                      - id: "throw_busy"
                        type: "Throw"
                        params:
                          throw:
                            _eq:
                              - _request:
                                  _string.concat:
                                    - _state: "operation"
                                    - ".status"
                              - 503
                          message: "Already ingesting"
                    catch:
                      - id: "modal_clear_e"
                        type: "SetState"
                        params:
                          username: ""
                          password: ""
                          ingest_username: ""
                          ingest_password: ""

  sider:
    _ref: "templates/sider.yaml"

  footer:
    _ref: "templates/footer.yaml"

