# Language: Lowdefy YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

# Filter Catalog
id: "filter"
type: "PageSiderMenu"
properties:
  title:
    _string.concat:
      - _global: "title"
      - " | Filter"
  header:
    color:
      _global: "color"
  logo:
    _global: "logo"
layout:
  contentJustify: "center"

requests:
  - _ref: "templates/ready.yaml"

  - id: "schema_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    properties:
      url: "/schema"
      method: "get"

  - id: "search_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      results_paging:
        _state: "results_paging"
      category:
        _state: "category"
      resourcetype:
        _state: "resourcetype"
      language:
        _state: "language"
      license:
        _state: "license"
      format:
        _state: "format"
      from:
        _state: "from"
      till:
        _state: "till"
      newest:
        _state: "sort"
    properties:
      url:
        _ref: "templates/url.yaml"
      method: "get"
      params:
        _if:
          test:
            _eq:
              - _payload: "results_paging"
              - null
          then:
            category:
              _payload: "category"
            resourcetype:
              _payload: "resourcetype"
            language:
              _payload: "language"
            license:
              _payload: "license"
            format:
              _payload: "format"
            from:
              _payload: "from"
            till:
              _payload: "till"
            newest:
              _payload: "newest"
          else: {}

events:
  onInit:
    - id: "schema_enter"
      type: "Request"
      params: "schema_request"

  onMountAsync:
    - id: "ready_enter"
      type: "Request"
      params: "ready_request"

areas:
  content:
    gutter: 16
    blocks:
## Page Title
      - id: "heading"
        type: "Title"
        properties:
          content: "Filter Search"
          level: 1
## General Filters Card
      - id: "general_card"
        type: "Card"
        areas:
          content:
            gutter: 16
            blocks:
## Left Column
              - id: "left"
                type: "Box"
                layout:
                  span: 12
                blocks:
                  - id: "filter_card"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Select Filters"
                      headerStyle:
                        font-size: "large"
                    areas:
                      content:
                        gutter: 16
                        blocks:
## Resource Type Filter
                          - id: "resourcetype"
                            type: "Selector"
                            properties:
                              label:
                                disabled: true
                              placeholder:
                                _request: "schema_request.data.data.attributes.resourceType.label"
                              options:
                                _array.concat:
                                  - _array.map:
                                      on:
                                        _request: "schema_request.data.data.attributes.resourceType.facets"
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: false
                                  - _array.map:
                                      on:
                                        _array.filter:
                                          on:
                                            _request: "schema_request.data.data.attributes.resourceType.enum"
                                          callback:
                                            _function:
                                              __not:
                                                __array.includes:
                                                  on:
                                                    __request: "schema_request.data.data.attributes.resourceType.facets"
                                                  value:
                                                    __args: 0
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: true
                            events:
                              _ref: "templates/clear.yaml"
## Category Filter
                          - id: "category"
                            type: "Selector"
                            properties:
                              label:
                                disabled: true
                              placeholder:
                                _request: "schema_request.data.data.attributes.categories.label"
                              options:
                                _array.concat:
                                  - _array.map:
                                      on:
                                        _request: "schema_request.data.data.attributes.categories.facets"
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: false
                                  - _array.map:
                                      on:
                                        _array.filter:
                                          on:
                                            _request: "schema_request.data.data.attributes.categories.enum"
                                          callback:
                                            _function:
                                              __not:
                                                __array.includes:
                                                  on:
                                                    __request: "schema_request.data.data.attributes.categories.facets"
                                                  value:
                                                    __args: 0
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: true
                            events:
                              _ref: "templates/clear.yaml"
## Language Filter
                          - id: "language"
                            type: "Selector"
                            properties:
                              label:
                                disabled: true
                              placeholder:
                                _request: "schema_request.data.data.attributes.language.label"
                              options:
                                _array.concat:
                                  - _array.map:
                                      on:
                                        _request: "schema_request.data.data.attributes.language.facets"
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: false
                                  - _array.map:
                                      on:
                                        _array.filter:
                                          on:
                                            _request: "schema_request.data.data.attributes.language.enum"
                                          callback:
                                            _function:
                                              __not:
                                                __array.includes:
                                                  on:
                                                    __request: "schema_request.data.data.attributes.language.facets"
                                                  value:
                                                    __args: 0
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: true
                            events:
                              _ref: "templates/clear.yaml"
## License Filter
                          - id: "license"
                            type: "Selector"
                            properties:
                              label:
                                disabled: true
                              placeholder:
                                _request: "schema_request.data.data.attributes.license.label"
                              options:
                                _array.concat:
                                  - _array.map:
                                      on:
                                        _request: "schema_request.data.data.attributes.license.facets"
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: false
                                  - _array.map:
                                      on:
                                        _array.filter:
                                          on:
                                            _request: "schema_request.data.data.attributes.license.enum"
                                          callback:
                                            _function:
                                              __not:
                                                __array.includes:
                                                  on:
                                                    __request: "schema_request.data.data.attributes.license.facets"
                                                  value:
                                                    __args: 0
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: true
                            events:
                              _ref: "templates/clear.yaml"
## Format Filter
                          - id: "format"
                            type: "Selector"
                            properties:
                              label:
                                disabled: true
                              placeholder:
                                _request: "schema_request.data.data.attributes.rawFormat.label"
                              options:
                                _array.concat:
                                  - _array.map:
                                      on:
                                        _request: "schema_request.data.data.attributes.rawFormat.facets"
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: false
                                  - _array.map:
                                      on:
                                        _array.filter:
                                          on:
                                            _request: "schema_request.data.data.attributes.rawFormat.enum"
                                          callback:
                                            _function:
                                              __not:
                                                __array.includes:
                                                  on:
                                                    __request: "schema_request.data.data.attributes.rawFormat.facets"
                                                  value:
                                                    __args: 0
                                      callback:
                                        _function:
                                          value:
                                            __args: 0
                                          disabled: true
                            events:
                              _ref: "templates/clear.yaml"
## Publication Year Filter
                          - id: "from"
                            type: "NumberInput"
                            properties:
                              label:
                                disabled: true
                              min: -9999
                              max: 9999
                              precision: 0
                              placeholder: "From Year"
                            layout:
                              span: 12
                            events:
                              _ref: "templates/clear.yaml"
                          - id: "till"
                            type: "NumberInput"
                            properties:
                              label:
                                disabled: true
                              min: -9999
                              max: 9999
                              precision: 0
                              placeholder: "Till Year"
                            events:
                              _ref: "templates/clear.yaml"
                            layout:
                              span: 12
## Sort Button
                          - id: "sort"
                            type: "ButtonSelector"
                            properties:
                              options:
                                - disabled: false
                                  label: "No Order"
                                  style:
                                    width: "33.3%"
                                    text-align: "center"
                                  value: null
                                - disabled: false
                                  label: "Newest First"
                                  style:
                                    width: "33.3%"
                                    text-align: "center"
                                  value: true
                                - disabled: false
                                  label: "Oldest First"
                                  style:
                                    width: "33.3%"
                                    text-align: "center"
                                  value: false
                              inputStyle:
                                width: "100%"
                              label:
                                colon: false
                                disabled: true
                            events:
                              _ref: "templates/clear.yaml"
## Submit Button
                          - id: "enter_button"  # Do not change! This name is needed to trigger by pressing "Enter"
                            type: "Button"
                            properties:
                              block: true
                              size: "large"
                              title: "Search"
                              icon: "AiFillRocket"
                            events:
                              onClick:
                                - id: "clear_results"
                                  type: "SetState"
                                  params:
                                    results_list: []
                                - id: "clear_paging"
                                  type: "SetState"
                                  params:
                                    results_paging:
                                      skip: 0
                                - id: "submit_query"
                                  type: "Request"
                                  params: "search_request"
                                - _ref: "templates/update.yaml"
## Right Column
              - id: "filter_help"
                type: "Card"
                layout:
                  span: 12
                properties:
                  bordered: false
                  size: "small"
                  title: "Filter Help"
                  headerStyle:
                    font-size: "large"
                areas:
                  content:
                    gutter: 16
                    blocks:
                      - id: "filter_md"
                        type: "Markdown"
                        properties:
                          content: |
                            The facet / filter search returns a subset of metadata records determined by enumerated or numeric record properties.
                            The background color of the result items indicate comprehensive (green), sufficient (yellow) or incomplete (red) metadata.

                            > Selectors list only occuring options (facets), not all available options!

                            * **Resource Types**: Filter by the types from [DataCite](https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/resourceTypeGeneral/).
                            * **Categories**: Filter by a controlled vocabulary of keywords.
                            * **Languages**: Filter by the primary language.
                            * **Licenses**: Filter by license ([SPDX identifier](https://spdx.org/licenses/)).
                            * **Formats**: Filter by metadata format.
                            * **From**: A number (-9999 ≤ x ≤ 9999) setting the minimal publication year.
                            * **Till**: A number (-9999 ≤ x ≤ 9999) setting the maximal publication year.
                            * **Order**: Sets the ordering of results: no order (default), from new to old, or old to new.

                      - id: "filter_detail"
                        type: "Collapse"
                        properties:
                          defaultActiveKey: "none"
                          panels:
                            - key: "technically"
                              title: "Technically"
                        areas:
                          technically:
                            blocks:
                              - id: "technically"
                                type: "Markdown"
                                properties:
                                  content: |
                                    1. The facets / filters "Categories", "Resource Types", "Languages", "Licenses" are filled by the GET request:

                                        ```
                                        /api/v1/schema
                                        ```
                                    2. Clicking "Search" sends the GET request:

                                        ```
                                        /api/v1/metadata?category=x&resourcetype=y&language=z&license=a&from=b&till=c&newest=true
                                        ```
                                       The server filters null or empty filters.

                                    3. Paging forward or backwards in the results resends the GET request with an additional `page` parameter:

                                        ```
                                        /api/v1/metadata?category=x&resourcetype=y&language=z&license=a&from=b&till=c&newest=true&page=q
                                        ```
## Results Card
      - _ref: "templates/results.yaml"

  sider:
    _ref: "templates/sider.yaml"

  footer:
    _ref: "templates/footer.yaml"
