# Filter Catalog
id: "resolve"
type: "PageSiderMenu"
properties:
  title:
    _string.concat:
      - _global: "title"
      - " | Resolve"
  header:
    color:
      _global: "color"
  logo:
    _global: "logo"
layout:
  contentJustify: "center"

requests:
  - _ref: "templates/ready.yaml"

  - id: "search_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      _state: true
    properties:
      url:
        _if:
          test:
            _eq:
              - _payload: "results_paging"
              - null
          then: "metadata"
          else:
            _string.substring:
              on:
                _get:
                  from:
                    _payload: "results_paging"
                  key: "url"
              start:
                _string.indexOf:
                  on:
                    _get:
                      from:
                        _payload: "results_paging"
                      key: "url"
                  searchValue: "metadata?"
      method: "get"
      params:
        _if:
          test:
            _eq:
              - _payload: "results_paging"
              - null
          then:
            doi:
              _payload: "doi_text"
          else: {}

events:
  onMountAsync:
    - id: "ready_enter"
      type: "Request"
      params: "ready_request"

areas:
  content:
    gutter: 16
    blocks:
## Page Title
      - id: "heading"
        type: "Title"
        properties:
          content: "DOI Search"
          level: 1
## General Filters Card
      - id: "general_card"
        type: "Card"
        areas:
          content:
            gutter: 16
            blocks:
## Left Column
              - id: "left"
                type: "Box"
                layout:
                  span: 12
                blocks:
                  - id: "resolve_card"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Enter Digital Object Identifier"
                      headerStyle:
                        font-size: "large"
                    areas:
                      content:
                        gutter: 16
                        blocks:
## DOI Textbox
                          - id: "doi_text"
                            type: "TextInput"
                            required: true
                            validate:
                              - message: "Cannot be white-space only!"
                                pass:
                                  _regex: "[^\\s]+"
                            properties:
                              label:
                                disabled: true
                              placeholder: "10.5555/xyz"
                            events:
                              _ref: "templates/clear.yaml"
## Search Button
                          - id: "enter_button"  # Do not change! This name is needed to trigger by pressing "Enter"
                            type: "Button"
                            properties:
                              block: true
                              size: "large"
                              title: "Search"
                              icon: "AiFillRocket"
                            events:
                              onClick:
                                - id: "validate_query"
                                  type: "Validate"
                                - id: "clear_results"
                                  type: "SetState"
                                  params:
                                    results_list: []
                                - id: "clear_paging"
                                  type: "SetState"
                                  params:
                                    results_paging:
                                      skip: 0
                                - id: "submit_query"
                                  type: "Request"
                                  params: "search_request"
                                - _ref: "templates/update.yaml"
## Right Column
              - id: "resolve_help"
                type: "Card"
                layout:
                  span: 12
                properties:
                  bordered: false
                  size: "small"
                  title: "Search Help"
                  headerStyle:
                    font-size: "large"
                areas:
                  content:
                    gutter: 16
                    blocks:
                      - id: "resolve_md"
                        type: "Markdown"
                        properties:
                          content: |
                            The DOI search returns all records with the record identifier type `doi` and the matching DOI.

                            * **DOI**: The digital object identifier.

                      - id: "resolve_detail"
                        type: "Collapse"
                        properties:
                          defaultActiveKey: "none"
                          panels:
                            - key: "technically"
                              title: "Technically"
                        areas:
                          technically:
                            blocks:
                              - id: "technically"
                                type: "Markdown"
                                properties:
                                  content: |
                                    1. Clicking "Search" sends the GET request:

                                        ```
                                        /api/v1/metadata?doi=x
                                        ```
## Results Card
      - _ref: "templates/results.yaml"

  sider:
    _ref: "templates/sider.yaml"

  footer:
    _ref: "templates/footer.yaml"
