## Raw Card
                  - id: "schemas"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Original Metadata"
                      headerStyle:
                        font-size: "large"
                        margin-top:
                          _global: "offset_medium"
                    blocks:
## Raw Metadata
                      - id: "raw_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.rawMetadata.label"
                        blocks:
                          - id: "raw_paragraph"
                            type: "MarkdownWithCode"
                            style:
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if:
                                  test:
                                    _eq:
                                      - _if_none:
                                          - _request: "record_request.data.data.attributes.rawMetadata"
                                          - ""
                                      - ""
                                  then:
                                    _global: "unknown"
                                  else:
                                    _string.concat:
                                      - "```xml\n"
                                      - _request: "record_request.data.data.attributes.rawMetadata"
                                      - "\n```"
## Metadata Checksum
                      - id: "checksum_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
