                            properties:
                              title:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.license.name"
                                  - _global: "unknown"
                              href:
                                _request: "record_request.data.data.attributes.license.data"
                              newTab: true
## Rights
                      - id: "rights_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.rights.label"
                        blocks:
                          - id: "rights_text"
                            type: "Paragraph"
                            style:
                              font-size: "medium"
                              margin-top:
                                _global: "offset_small"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.rights"
                                  - _global: "unknown"
## Fundings
                      - id: "fundings_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.fundings.label"
                        blocks:
                          - id: "fundings_list"
                            type: "List"
                            blocks:
                              - id: "fundings_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "fundings_list.$"
                                          - null
                                      then:
                                        _global: "unknown"
                                      else:
                                        _if:
                                          test:
                                            _eq:
                                              - _state: "fundings_list.$.data"
                                              - null
                                          then:
                                            - _state: "fundings_list.$.name"
                                          else:
                                            _string.concat:
                                              - _state: "fundings_list.$.name"
                                              - " ("
                                              - _state: "fundings_list.$.data"
                                              - ")"
## Description
                      - id: "description_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.description.label"
                        blocks:
                          - id: "description_text"
                            type: "Paragraph"
                            style:
                              font-size: "medium"
                              margin-top:
                                _global: "offset_small"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.description"
                                  - _global: "unknown"
## Links
                      - id: "links_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.externalItems.label"
                        blocks:
                          - id: "links_list"
                            type: "List"
                            blocks:
                              - id: "links_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if_none:
                                      - _state: "links_list.$.name"
                                      - _global: "unknown"
                                  href:
                                    _state: "links_list.$.data"
                                  newTab: true
## Relations
                  - id: "relations_card"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Relationships"
                      headerStyle:
                        font-size: "large"
                    blocks:
                      - id: "relations_list"
                        type: "List"
                        blocks:
                          - id: "relations_label.$"
                            type: "Label"
                            properties:
                              span: 5
                              align: "right"
                              title:
                                _if:
                                  test:
                                    _state: "relations_list.$.isOut"
                                  then:
                                    _get:
                                      from:
                                        _get:
                                          from:
                                            _request: "schema_request.data.data.attributes"
                                          key:
                                            _string.concat:
                                              - "@"
                                              - _state: "relations_list.$.type"
                                      key: "label"
                                  else:
                                    _if_none:
                                      - _get:
                                          from:
                                            _get:
                                              from:
                                                _request: "schema_request.data.data.attributes"
                                              key:
                                                _string.concat:
                                                  - "@"
                                                  - _state: "relations_list.$.type"
                                          key: "label"
                                      - _get:
                                          from:
                                            _get:
                                              from:
                                                _request: "schema_request.data.data.attributes"
                                              key:
                                                _string.concat:
                                                  - "@"
                                                  - _state: "relations_list.$.type"
                                          key: "label"
                            blocks:
                              - id: "relations_link.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  href:
                                    _string.concat:
                                      - "fetch?id="
                                      - _state: "relations_list.$.recordId"
                                  title:
                                    _string.concat:
                                      - _if_none:
                                          - _state: "relations_list.$.name"
                                          - _global: "unknown"
                                      - " ("
                                      - _if_none:
                                          - _state: "relations_list.$.publicationYear"
                                          - _global: "unknown"
                                      - ") "
                                      - _if_none:
                                          - _state: "relations_list.$.resourceType"
                                          - _global: "unknown"

## Social
                  - id: "social"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Social Metadata"
                      headerStyle:
