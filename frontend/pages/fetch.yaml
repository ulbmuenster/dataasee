# Language: Lowdefy YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

# Record Panel
id: "fetch"
type: "PageSiderMenu"
properties:
  title:
    _string.concat:
      - _global: "title"
      - " | Display"
  header:
    color:
      _global: "color"
  logo:
    _global: "logo"

requests:
  - _ref: "templates/ready.yaml"

  - id: "schema_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    properties:
      url: "/schema"
      method: "get"

  - id: "record_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      id:
        _url_query: "id"
    properties:
      url: "/metadata"
      method: "get"
      params:
        id:
          _if_none:
            - _payload: "id"
            - "dataasee"

  - id: "export_bibjson_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      id:
        _url_query: "id"
    properties:
      url: "/metadata"
      method: "get"
      params:
        id:
          _payload: "id"
        format: "bibjson"

  - id: "export_datacite_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      id:
        _url_query: "id"
    properties:
      url: "/metadata"
      method: "get"
      params:
        id:
          _payload: "id"
        format: "datacite"

events:
  onInit:
    - id: "schema_enter"
      type: "Request"
      params: "schema_request"

  onMountAsync:
    - id: "ready_enter"
      type: "Request"
      params: "ready_request"

    - id: "record_enter"
      type: "Request"
      params: "record_request"

    - id: "update_creators"
      type: "SetState"
      params:
        creators_list:
          _if_none:
            - _request: "record_request.data.data.attributes.creators"
            - - null

    - id: "update_identifiers"
      type: "SetState"
      params:
        identifiers_list:
          _if_none:
            - _request: "record_request.data.data.attributes.identifiers"
            - - null

    - id: "update_categories"
      type: "SetState"
      params:
        categories_list:
          _if_none:
            - _request: "record_request.data.data.attributes.categories"
            - - null

    - id: "update_subjects"
      type: "SetState"
      params:
        subjects_list:
          _if_none:
            - _request: "record_request.data.data.attributes.subjects"
            - - null

    - id: "update_fundings"
      type: "SetState"
      params:
        fundings_list:
          _if_none:
            - _request: "record_request.data.data.attributes.fundings"
            - - null

    - id: "update_links"
      type: "SetState"
      params:
        links_list:
          _if_none:
            - _request: "record_request.data.data.attributes.relatedItems"
            - - null

    - id: "update_synonyms"
      type: "SetState"
      params:
        synonyms_list:
          _if_none:
            - _request: "record_request.data.data.attributes.synonyms"
            - - null

    - id: "update_relations"
      type: "SetState"
      params:
        relations_list:
          _if_none:
            - _array.map:
                on:
                  _array.filter:
                    on:
                      _object.entries:
                        _request: "record_request.data.data.attributes"
                    callback:
                      _function:
                        __string.startsWith:
                          on:
                            __args: "0.0"
                          searchString: "@"
                callback:
                  _function:
                    __args: 0.0
            - - null

    - id: "update_relations_values"
      type: "SetState"
      params:
        _object.fromEntries:
          _array.map:
            on:
              _array.filter:
                on:
                  _object.entries:
                    _request: "record_request.data.data.attributes"
                callback:
                  _function:
                    __string.startsWith:
                      on:
                        __args: "0.0"
                      searchString: "@"
            callback:
              _function:
                - __string.concat:
                    - "relations_values."
                    - __args: 1
                - __args: "0.1"

areas:
  content:
    gutter: 16
    blocks:
## Page Title
      - id: "page_h2"
        type: "Title"
        properties:
          content: "Display Record"
          level: 1
## Metadata Card
      - id: "metadata"
        type: "Card"
        areas:
          content:
            gutter: 16
            blocks:

## Left Column
              - id: "left"
                type: "Box"
                layout:
                  span: 12
                blocks:
## Mandatory
                  - id: "mandatory"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Mandatory Metadata"
                      headerStyle:
                        font-size: "large"
                    blocks:
## Title
                      - id: "title_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.title.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "title_text"
                            type: "Paragraph"
                            style:
                              font-size: "large"
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.title"
                                  - _global: "unknown"
                              strong: true
## Creators
                      - id: "creators_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.creators.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "creators_list"
                            type: "List"
                            blocks:
                              - id: "creators_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if_none:
                                      - _state: "creators_list.$.name"
                                      - _global: "unknown"
                                  href:
                                    _state: "creators_list.$.data"
                                  newTab: true
## Publisher
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "publisher_label"
                            id_value: "publisher_text"
                            key:
                              _request: "schema_request.data.data.attributes.publisher.label"
                            value:
                              _request: "record_request.data.data.attributes.publisher"
## Publication Year
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "published_label"
                            id_value: "published_text"
                            key:
                              _request: "schema_request.data.data.attributes.publicationYear.label"
                            value:
                              _request: "record_request.data.data.attributes.publicationYear"
## Resource Type
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "resourcetype_label"
                            id_value: "resourcetype_text"
                            key:
                              _request: "schema_request.data.data.attributes.resourceType.label"
                            value:
                              _request: "record_request.data.data.attributes.resourceType"
## Identifiers
                      - id: "identifiers_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.identifiers.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "identifiers_list"
                            type: "List"
                            blocks:
                              - id: "identifiers_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  url:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "identifiers_list.$.data"
                                          - "doi"
                                      then:
                                        _state: "identifiers_list.$.name"
                                      else: null
                                  title:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "identifiers_list.$"
                                          - null
                                      then:
                                        _global: "unknown"
                                      else:
                                        _if:
                                          test:
                                            _eq:
                                              - _if_none:
                                                  - _state: "identifiers_list.$.data"
                                                  - ""
                                              - ""
                                          then:
                                            _state: "identifiers_list.$.name"
                                          else:
                                            _string.concat:
                                              - _state: "identifiers_list.$.name"
                                              - " ("
                                              - _state: "identifiers_list.$.data"
                                              - ")"
## Optional
                  - id: "optional"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Optional Metadata"
                      headerStyle:
                        font-size: "large"
                    blocks:
## Synonyms
                      - id: "synonyms_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.synonyms.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "synonyms_list"
                            type: "List"
                            blocks:
                              - id: "synonyms_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "synonyms_list.$"
                                          - null
                                      then:
                                        _global: "unknown"
                                      else:
                                        _string.concat:
                                          - _state: "synonyms_list.$.name"
                                          - " ("
                                          - _state: "synonyms_list.$.data"
                                          - ")"
## Language
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "language_label"
                            id_value: "language_text"
                            key:
                              _request: "schema_request.data.data.attributes.language.label"
                            value:
                              _request: "record_request.data.data.attributes.language"
## Subjects
                      - id: "subjects_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.subjects.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "subjects_list"
                            type: "List"
                            blocks:
                              - id: "subjects_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if_none:
                                      - _state: "subjects_list.$.name"
                                      - _global: "unknown"
                                  href:
                                    _state: "subjects_list.$.data"
                                  newTab: true
## Version
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "version_label"
                            id_value: "version_text"
                            key:
                              _request: "schema_request.data.data.attributes.version.label"
                            value:
                              _request: "record_request.data.data.attributes.version"
## License
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "license_label"
                            id_value: "license_text"
                            key:
                              _request: "schema_request.data.data.attributes.license.label"
                            value:
                              _request: "record_request.data.data.attributes.license.name"
                            link:
                              _request: "record_request.data.data.attributes.license.data"
## Rights
                      - id: "rights_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.rights.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "rights_text"
                            type: "Paragraph"
                            style:
                              font-size: "medium"
                              margin-top:
                                _global: "offset_small"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.rights"
                                  - _global: "unknown"
## Fundings
                      - id: "fundings_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.fundings.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "fundings_list"
                            type: "List"
                            blocks:
                              - id: "fundings_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "fundings_list.$"
                                          - null
                                      then:
                                        _global: "unknown"
                                      else:
                                        _if:
                                          test:
                                            _eq:
                                              - _state: "fundings_list.$.data"
                                              - null
                                          then:
                                            - _state: "fundings_list.$.name"
                                          else:
                                            _string.concat:
                                              - _state: "fundings_list.$.name"
                                              - " ("
                                              - _state: "fundings_list.$.data"
                                              - ")"
## Description
                      - id: "description_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.description.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "description_text"
                            type: "Paragraph"
                            style:
                              font-size: "medium"
                              margin-top:
                                _global: "offset_small"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.description"
                                  - _global: "unknown"
## Links
                      - id: "links_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.relatedItems.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "links_list"
                            type: "List"
                            blocks:
                              - id: "links_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if_none:
                                      - _state: "links_list.$.name"
                                      - _global: "unknown"
                                  href:
                                    _state: "links_list.$.data"
                                  newTab: true
## Relations
                  - id: "relations_card"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Relationships"
                      headerStyle:
                        font-size: "large"
                    blocks:
                      - id: "relations_list"
                        type: "List"
                        blocks:
                          - id: "relations_label.$"
                            type: "Label"
                            properties:
                              span: 5
                              align: "right"
                              title:
                                _if:
                                  test:
                                    _string.endsWith:
                                      on:
                                        _state: "relations_list.$.0"
                                      searchString: "_i"
                                  then:
                                    _get:
                                      from:
                                        _get:
                                          from:
                                            _request: "schema_request.data.data.attributes"
                                          key:
                                            _state: "relations_list.$.0"
                                      key: "label_in"
                                  else:
                                    _get:
                                      from:
                                        _get:
                                          from:
                                            _request: "schema_request.data.data.attributes"
                                          key:
                                            _state: "relations_list.$.0"
                                      key: "label_out"
                              style:
                                font-weight: "bold"
                            blocks:
                              - id: "relations_values.$"
                                type: "List"
                                blocks:
                                  - id: "relations_value.$.$"
                                    type: "Anchor"
                                    style:
                                      font-size: "large"
                                      margin-top:
                                        _global: "offset_medium"
                                    properties:
                                      title:
                                        _if_none:
                                          - _state: "relations_values.$.$.name"
                                          - _global: "unknown"
                                      href:
                                        _string.concat:
                                          - "fetch?id="
                                          - _state: "relations_values.$.$.data"
## Social
                  - id: "social"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Social Metadata"
                      headerStyle:
                        font-size: "large"
                    blocks:
## Categories
                      - id: "categories_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.categories.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "categories_list"
                            type: "List"
                            blocks:
                              - id: "categories_text.$"
                                type: "Paragraph"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  content:
                                    _if_none:
                                      - _state: "categories_list.$"
                                      - _global: "unknown"
## Keywords
                      - id: "keywords_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.keywords.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "keywords_text"
                            type: "Paragraph"
                            style:
                              font-size: "large"
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if:
                                  test:
                                    _not:
                                      _request: "record_request.data.data.attributes.keywords"
                                  then:
                                    _global: "unknown"
                                  else:
                                    _request: "record_request.data.data.attributes.keywords"
## Process
                  - id: "process"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Process Metadata"
                      headerStyle:
                        font-size: "large"
                    blocks:
## Schema Version
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "schema_label"
                            id_value: "schema_text"
                            key:
                              _request: "schema_request.data.data.attributes.schemaVersion.label"
                            value:
                              _request: "record_request.data.data.attributes.schemaVersion"
## Record Id
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "schema_label"
                            id_value: "schema_text"
                            key:
                              _request: "schema_request.data.data.attributes.recordId.label"
                            value:
                              _request: "record_request.data.data.attributes.recordId"
                            link:
                              _string.concat:
                                - "fetch?id="
                                - _request: "record_request.data.data.attributes.recordId"
## Metadata Quality
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "quality_label"
                            id_value: "quality_text"
                            key:
                              _request: "schema_request.data.data.attributes.metadataQuality.label"
                            value:
                              _request: "record_request.data.data.attributes.metadataQuality"
## Data Steward
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "datasteward_label"
                            id_value: "datasteward_text"
                            key:
                              _request: "schema_request.data.data.attributes.dataSteward.label"
                            value:
                              _request: "record_request.data.data.attributes.dataSteward"
## Source
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "source_label"
                            id_value: "source_text"
                            key:
                              _request: "schema_request.data.data.attributes.source.label"
                            value:
                              _request: "record_request.data.data.attributes.source"
## Source Rights
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "sourcerights_label"
                            id_value: "sourcerights_text"
                            key:
                              _request: "schema_request.data.data.attributes.sourceRights.label"
                            value:
                              _request: "record_request.data.data.attributes.sourceRights"
## Created
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "created_label"
                            id_value: "created_text"
                            key:
                              _request: "schema_request.data.data.attributes.createdAt.label"
                            value:
                              _request: "record_request.data.data.attributes.createdAt"
## Technical
                  - id: "technical"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Technical Metadata"
                      headerStyle:
                        font-size: "large"
                        margin-top:
                          _global: "offset_medium"
                    blocks:
## Metadata Format
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "metadataformat_label"
                            id_value: "metadataformat_text"
                            key:
                              _request: "schema_request.data.data.attributes.rawFormat.label"
                            value:
                              _request: "record_request.data.data.attributes.rawFormat"
## Data Size
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "size_label"
                            id_value: "size_text"
                            key:
                              _request: "schema_request.data.data.attributes.sizeBytes.label"
                            value:
                              _request: "record_request.data.data.attributes.sizeBytes"
## Data Format
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "format_label"
                            id_value: "format_text"
                            key:
                              _request: "schema_request.data.data.attributes.dataFormat.label"
                            value:
                              _request: "record_request.data.data.attributes.dataFormat"
## Location
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "location_label"
                            id_value: "location_text"
                            key:
                              _request: "schema_request.data.data.attributes.dataLocation.label"
                            value:
                              _request: "record_request.data.data.attributes.dataLocation"
## Raw Card
                  - id: "schemas"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Original Metadata"
                      headerStyle:
                        font-size: "large"
                        margin-top:
                          _global: "offset_medium"
                    blocks:
## Raw Metadata
                      - id: "raw_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.rawMetadata.label"
                          style:
                            font-weight: "bold"
                        blocks:
                          - id: "raw_paragraph"
                            type: "MarkdownWithCode"
                            style:
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if:
                                  test:
                                    _eq:
                                      - _if_none:
                                          - _request: "record_request.data.data.attributes.rawMetadata"
                                          - ""
                                      - ""
                                  then:
                                    _global: "unknown"
                                  else:
                                    _string.concat:
                                      - "```xml\n"
                                      - _request: "record_request.data.data.attributes.rawMetadata"
                                      - "\n```"
## Metadata Checksum
                      - _ref:
                          path: "templates/keyvalue.yaml"
                          vars:
                            id_key: "checksum_label"
                            id_value: "checksum_text"
                            key:
                              _request: "schema_request.data.data.attributes.rawChecksum.label"
                            value:
                              _request: "record_request.data.data.attributes.rawChecksum"
## Export Card
                  - id: "export"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Export"
                      headerStyle:
                        font-size: "large"
                    blocks:
                      - id: "export_datacite"
                        type: "Anchor"
                        events:
                          onClick:
                            - id: "export_datacite_click"
                              type: "Request"
                              params: "export_datacite_request"
                            - id: "export_newtab"
                              type: "Link"
                              params:
                                newTab: true
                                url:
                                  _string.concat:
                                    - "data:application/json,"
                                    - _uri.encode:
                                        _json.stringify:
                                          on:
                                            _request: "export_datacite_request.data.data.attributes"
                        properties:
                          title: "DataCite"
                          style:
                            font-size: "large"
                          url: ""

                      - id: "export_bibjson"
                        type: "Anchor"
                        events:
                          onClick:
                            - id: "export_bibjson_click"
                              type: "Request"
                              params: "export_bibjson_request"
                            - id: "export_newtab"
                              type: "Link"
                              params:
                                newTab: true
                                url:
                                  _string.concat:
                                    - "data:application/json,"
                                    - _uri.encode:
                                        _json.stringify:
                                          on:
                                            _request: "export_bibjson_request.data.data.attributes"
                        properties:
                          title: "BibJSON"
                          style:
                            font-size: "large"
                          url: ""
## Right Column
              - id: "fetch_help"
                type: "Card"
                layout:
                  span: 12
                properties:
                  bordered: false
                  size: "small"
                  title: "Display Help"
                  headerStyle:
                    font-size: "large"
                areas:
                  content:
                    gutter: 16
                    blocks:
                      - id: "fetch_md"
                        type: "Markdown"
                        properties:
                          content: |
                            The display record site gives an overview about a record in the metadata-lake.

                            * **Mandatory Metadata**, core properties, typically set for all records.
                            * **Optional Metadata**, extra properties, sometimes set for records.
                            * **Relationships**, labeled links to other records.
                            * **Social Metadata**, properties relating to classification and findability.
                            * **Process Metadata**, properties relating to ingestion and parsing of this record.
                            * **Technical Metadata**, properties relating to the underlying data-set.
                            * **Original Metadata**, the original ingested metadata record.
                            * **Export**, provides exports of the metadata record in other formats.

                            A value of `[ᴇᴍᴘᴛʏ]` corresponds to `NULL`.

                      - id: "fetch_detail"
                        type: "Collapse"
                        properties:
                          defaultActiveKey: "none"
                          panels:
                            - key: "technically"
                              title: "Technically"
                        areas:
                          technically:
                            blocks:
                              - id: "fetch_technically"
                                type: "Markdown"
                                properties:
                                  content: |
                                    1. The field labels are retrieved via the database schema by a GET request to:

                                        ```
                                        /api/v1/schema
                                        ```
                                    2. The record data is retrieved by a GET request to:

                                        ```
                                        /api/v1/metadata?id=x
                                        ```
                                    3. The record data is exported by a GET request using the `format` option to:

                                        ```
                                        /api/v1/metadata?id=x&format=bibjson
                                        ```

  sider:
    _ref: "templates/sider.yaml"

  footer:
    _ref: "templates/footer.yaml"

