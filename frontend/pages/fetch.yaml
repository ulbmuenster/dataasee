# Language: Lowdefy YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

# Record Panel
id: "fetch"
type: "PageSiderMenu"
properties:
  title:
    _string.concat:
      - _global: "title"
      - " | Display"
  header:
    color:
      _global: "color"
  logo:
    _global: "logo"

requests:
  - _ref: "templates/ready.yaml"

  - id: "schema_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    properties:
      url: "/schema"
      method: "get"

  - id: "record_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      _url_query: true
    properties:
      url: "/metadata"
      method: "get"
      params:
        id:
          _payload: "id"

  - id: "export_bibjson_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      _url_query: true
    properties:
      url: "/metadata"
      method: "get"
      params:
        id:
          _payload: "id"
        format: "bibjson"

  - id: "export_datacite_request"
    type: "AxiosHttp"
    connectionId: "datalake_api"
    payload:
      _url_query: true
    properties:
      url: "/metadata"
      method: "get"
      params:
        id:
          _payload: "id"
        format: "datacite"

events:
  onInit:
    - id: "schema_enter"
      type: "Request"
      params: "schema_request"

  onMountAsync:
    - id: "ready_enter"
      type: "Request"
      params: "ready_request"

    - id: "record_enter"
      type: "Request"
      params: "record_request"

    - id: "update_creators"
      type: "SetState"
      params:
        creators_list:
          _if_none:
            - _request: "record_request.data.data.attributes.creators"
            - - null

    - id: "update_identifiers"
      type: "SetState"
      params:
        identifiers_list:
          _if_none:
            - _request: "record_request.data.data.attributes.identifiers"
            - - null

    - id: "update_categories"
      type: "SetState"
      params:
        categories_list:
          _if_none:
            - _request: "record_request.data.data.attributes.categories"
            - - null

    - id: "update_subjects"
      type: "SetState"
      params:
        subjects_list:
          _if_none:
            - _request: "record_request.data.data.attributes.subjects"
            - - null

    - id: "update_fundings"
      type: "SetState"
      params:
        fundings_list:
          _if_none:
            - _request: "record_request.data.data.attributes.fundings"
            - - null

    - id: "update_links"
      type: "SetState"
      params:
        links_list:
          _if_none:
            - _request: "record_request.data.data.attributes.externalItems"
            - - null

    - id: "update_synonyms"
      type: "SetState"
      params:
        synonyms_list:
          _if_none:
            - _request: "record_request.data.data.attributes.synonyms"
            - - null

    - id: "update_relations"
      type: "SetState"
      params:
        relations_list:
          _if_none:
            - _request: "record_request.data.data.attributes.relations"
            - - null

areas:
  content:
    gutter: 16
    blocks:
## Page Title
      - id: "page_h2"
        type: "Title"
        properties:
          content: "Display Record"
          level: 1
## Metadata Card
      - id: "metadata"
        type: "Card"
        areas:
          content:
            gutter: 16
            blocks:

## Left Column
              - id: "left"
                type: "Box"
                layout:
                  span: 12
                blocks:
## Mandatory
                  - id: "mandatory"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Mandatory Metadata"
                      headerStyle:
                        font-size: "large"
                    blocks:
## Title
                      - id: "title_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.name.label"
                        blocks:
                          - id: "title_text"
                            type: "Paragraph"
                            style:
                              font-size: "large"
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.name"
                                  - _global: "unknown"
                              strong: true
## Creators
                      - id: "creators_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.creators.label"
                        blocks:
                          - id: "creators_list"
                            type: "List"
                            blocks:
                              - id: "creators_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if_none:
                                      - _state: "creators_list.$.name"
                                      - _global: "unknown"
                                  href:
                                    _state: "creators_list.$.data"
                                  newTab: true
## Publisher
                      - id: "publisher_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.publisher.label"
                        blocks:
                          - id: "publisher_text"
                            type: "Paragraph"
                            style:
                              font-size: "large"
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.publisher"
                                  - _global: "unknown"
## Publication Year
                      - id: "published_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.publicationYear.label"
                        blocks:
                          - id: "published_text"
                            type: "Paragraph"
                            style:
                              font-size: "large"
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.publicationYear"
                                  - _global: "unknown"
## Resource Type
                      - id: "resourcetype_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.resourceType.label"
                        blocks:
                          - id: "resourcetype_text"
                            type: "Paragraph"
                            style:
                              font-size: "large"
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.resourceType"
                                  - _global: "unknown"
## Identifiers
                      - id: "identifiers_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.identifiers.label"
                        blocks:
                          - id: "identifiers_list"
                            type: "List"
                            blocks:
                              - id: "identifiers_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  url:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "identifiers_list.$.name"
                                          - "doi"
                                      then:
                                        _string.concat:
                                          - "https://doi.org/"
                                          - _state: "identifiers_list.$.data"
                                      else: null
                                  title:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "identifiers_list.$"
                                          - null
                                      then:
                                        _global: "unknown"
                                      else:
                                        _if:
                                          test:
                                            _eq:
                                              - _if_none:
                                                  - _state: "identifiers_list.$.name"
                                                  - ""
                                              - ""
                                          then:
                                            _state: "identifiers_list.$.data"
                                          else:
                                            _string.concat:
                                              - _state: "identifiers_list.$.name"
                                              - ": "
                                              - _state: "identifiers_list.$.data"
## Optional
                  - id: "optional"
                    type: "Card"
                    properties:
                      bordered: false
                      size: "small"
                      title: "Optional Metadata"
                      headerStyle:
                        font-size: "large"
                    blocks:
## Synonyms
                      - id: "synonyms_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.synonyms.label"
                        blocks:
                          - id: "synonyms_list"
                            type: "List"
                            blocks:
                              - id: "synonyms_text.$"
                                type: "Anchor"
                                style:
                                  font-size: "large"
                                  margin-top:
                                    _global: "offset_medium"
                                properties:
                                  title:
                                    _if:
                                      test:
                                        _eq:
                                          - _state: "synonyms_list.$"
                                          - null
                                      then:
                                        _global: "unknown"
                                      else:
                                        _string.concat:
                                          - _state: "synonyms_list.$.data"
                                          - " ("
                                          - _state: "synonyms_list.$.name"
                                          - ")"
## Language
                      - id: "language_label"
