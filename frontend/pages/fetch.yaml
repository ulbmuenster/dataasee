                            type: "Paragraph"
                            style:
                              font-size: "large"
                              margin-top:
                                _global: "offset_medium"
                            properties:
                              content:
                                _if_none:
                                  - _request: "record_request.data.data.attributes.metadataFormat"
                                  - _global: "unknown"
## Data Size
                      - id: "size_label"
                        type: "Label"
                        properties:
                          span: 5
                          align: "right"
                          title:
                            _request: "schema_request.data.data.attributes.sizeBytes.label"
