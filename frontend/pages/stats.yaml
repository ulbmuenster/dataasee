                                  scale: false
                                data:
                                  _array.map:
                                    on:
                                      _request: "stats_request.data.data.attributes.result.0.schemas"
                                    callback:
                                      _function:
                                        name:
                                          __args: "0.name"
                                        value:
                                          __args: "0.data"

  sider:
    _ref: "templates/sider.yaml"

  footer:
    _ref: "templates/footer.yaml"
