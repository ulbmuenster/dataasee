# Language: Lowdefy YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

lowdefy: "4.7.3"
name: "DatAasee"

cli:
  disableTelemetry: true

global:
  title: "DatAasee"
  logo:
    src: "logo-light-theme.png"
    alt: "DatAasee"
    style:
      filter: "invert(19%) sepia(88%) saturate(2015%) hue-rotate(182deg) brightness(96%) contrast(102%)"
      position: "relative"
      left: "-15%"
  unknown: "[ᴇᴍᴘᴛʏ]"
  success: "#52c41a"
  warning: "#faad14"
  error: "#f5222d"
  special: "#ccd1d1"
  schema: null
  offset_small: "-0.2ex"
  offset_medium: "-0.4ex"
  offset_large: "-1.4ex"

# This enables using the Enter-key to click certain buttons
app:
  html:
    appendBody: |
      <script>
        document.addEventListener("keypress", function(event) {
          if (!event.shiftKey && event.key === "Enter") {
            event.preventDefault();
            document.getElementById("enter_button").click();
          }
        });
      </script>

connections:
  - id: "datalake_api"
    type: "AxiosHttp"
    properties:
      #  maxContentLength: 1048576  # Activate if necessary
      timeout: 0
      baseURL:
        _secret: "DL_API"
      validateStatus:
        _function:
          true

menus:
  - id: "main"
    links:
      - id: "index"
        type: "MenuLink"
        properties:
          icon: "AiFillHome"
          title: "Home"
        pageId: "index"

      - id: "resolve"
        type: "MenuLink"
        properties:
          icon: "AiFillForward"
          title: "Resolve"
        pageId: "resolve"

      - id: "list"
        type: "MenuLink"
        properties:
          icon: "AiFillProfile"
          title: "List"
        pageId: "list"

      - id: "filter"
        type: "MenuLink"
        properties:
          icon: "AiFillFilter"
          title: "Filter"
        pageId: "filter"

      - id: "query"
        type: "MenuLink"
        properties:
          icon: "AiFillCode"
          title: "Query"
        pageId: "query"

      - id: "stats"
        type: "MenuLink"
        properties:
          icon: "AiFillSignal"
          title: "Statistics"
        pageId: "stats"

      - id: "about"
        type: "MenuLink"
        properties:
          icon: "AiFillApi"
          title: "Interface"
        pageId: "about"

      - id: "admin"
        type: "MenuLink"
        properties:
          icon: "AiFillControl"
          title: "Admin"
          danger: true
        pageId: "admin"

pages:
  - _ref: "pages/index.yaml"
  - _ref: "pages/filter.yaml"
  - _ref: "pages/resolve.yaml"
  - _ref: "pages/list.yaml"
  - _ref: "pages/query.yaml"
  - _ref: "pages/stats.yaml"
  - _ref: "pages/about.yaml"
  - _ref: "pages/fetch.yaml"
  - _ref: "pages/admin.yaml"

