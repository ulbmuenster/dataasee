# Language: Benthos YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

### Main server pipepline declaration

## Logger Format

logger:
  static_fields:
    '@service': '${DL_NAME} ${DL_VERSION}'

## Global Cache

cache_resources:
  - label: 'global_cache'
    memory:
      default_ttl: '5m'
      compaction_interval: '5m'

## API Server

input:
  label: 'api_server'
  http_server:
    address: '0.0.0.0:${DL_PORT}'
    path: '/'
    allowed_verbs:
      - 'GET'
      - 'POST'
    cors:
      enabled: true
      allowed_origins:
        - '*'
    timeout: '400s'
    sync_response:
      status: '${! metadata("status").or("200") }'
      headers:
        Server: '${DL_NAME}'
        Content-Type: 'application/json'
        Access-Control-Allow-Origin: '*'
      metadata_headers:
        include_patterns:
          - "WWW-Authenticate"

## API Router

  processors:
    - mapping: 'meta endpoint = metadata("http_server_request_path").trim_prefix("${DL_PATH}/")'

    - switch:

## Ensure Payload is not exhaustive
        - check: 'this.or("").bytes().length() > 12288 || content().bytes().length() > 12288'
          processors:
            - label: 'request__too_large'
              mapping: |
                meta status = "413"
                root.errors = [{"title": "Request Error: Payload Too Large",
                                "detail": "The request exceeds 12KiB."}]

## Ensure Request is not exhaustive TODO: split into header and body once Benthos has spearate metadata objects
        - check: 'metadata().bytes().length() > 8192'
          processors:
            - label: 'request__too_long'
              mapping: |
                meta status = "414"
                root.errors = [{"title": "Request Error: Request-URI Too Long",
                                "detail": "The combined size of request header and request URI exceeds 8KiB."}]

## Basic Authentication Challenge (All POST requests need authentication!)
        - check: 'metadata("http_server_verb") == "POST" && metadata("Authorization") == null'
          processors:
            - label: 'post_request__no_authorization'
              mapping: |
                meta status = "401"
                meta "WWW-Authenticate" = "Basic realm=\"DatAasee Admin\""
                root.errors = [{"title": "Request Error: Unauthorized",
                                "detail": "Authentication required."}]

## Basic Authentication for POST Requests
        - check: 'metadata("http_server_verb") == "POST" && metadata("Authorization").string().trim_prefix("Basic ").decode("base64").catch("").hash("sha256").encode("hex") != (env("DL_USER") + ":" + file(env("DL_PASS"))).hash("sha256").encode("hex")'
          processors:
            - label: 'post_request__invalid_authentication'
              mapping: |
                meta status = "403"
                meta "WWW-Authenticate" = "Basic realm=\"DatAasee Admin\""
                root.errors = [{"title": "Request Error: Unauthorized",
                                "detail": "Invalid or missing credentials."}]

## Ensure JSON is accepted
        - check: 'metadata("Accept") != null && !metadata("Accept").re_match(".*((application\\/x-www-form-urlencoded)|(application\\/json)|(application\\/vnd.api\\+json)|(\\*\\/\\*)).*")'
          processors:
            - label: 'any_request__non_json_content_type'
              mapping: |
                meta status = "406"
                root.errors = [{"title": "Request Error: Not Acceptable",
                                "detail": "Requested response content-type has to be \"application/json\" or \"application/x-www-form-urlencoded\"."}]

## GET Endpoint Handlers
        - check: 'metadata("http_server_verb") == "GET"'
          processors:
            - resource: 'handlers_get'

## POST Endpoint Handlers
        - check: 'metadata("http_server_verb") == "POST"'
          processors:
            - resource: 'handlers_post'

## Response Modeling
    - switch:

## Authentication Challenge
        - check: 'metadata("http_server_verb") == "POST" && metadata("Authorization") == null'
          processors:
            - label: 'post_request__authentication_challenge'
              mapping: |
                root = {}

## Bare Payload (JSON Files)
        - check: 'metadata("endpoint") == "api" && !this.exists("errors")'
          processors:
            - label: 'api_endpoint__direct'
              mapping: |
                root = this.data

## JSON-API Wrapper
        - processors:
            - label: 'any_request__json_api_wrapper'
              mapping: |
                root = if this.exists("errors") { this.with("errors") } else { this.with("data") }
                root.meta.name = env("DL_NAME")
                root.meta.version = env("DL_VERSION")
                root.links.self = "${DL_BASE}${DL_PATH}/" + metadata("endpoint") + metadata("params").or("")
                root.links.describedby = "${DL_BASE}${DL_PATH}/" + "api?response=" + metadata("endpoint")
                root.links = root.links.merge(metadata("links").or({}))

    - sync_response: {}

## Async Buffer

buffer:
  memory: {}

## Async Handler

output:
  processors:
    - switch:
        - check: 'metadata("endpoint") == "ingest"'
          processors:
            - resource: 'handler_ingest_async'

  drop: {}
