# Language: Benthos YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

processor_resources:
  - label: 'handler_metadata'
    switch:
      - check: '["id","search","language","license","resourcetype","category","format","doi","from","till","page","newest"].any(x -> metadata(x).or("").length() > 255) || metadata("query").or("").length() > 4096'
        processors:
          - mapping: |
              meta status = "414"
              root.errors = [ { "title": "Request Error: Request-Uri Too Long",
                                "detail": "Custom query parameter exceeds 4KiB or other query parameters exceed 256B" } ]

      - processors:
          - try:
              - switch:
                  - check: 'metadata("id") == "dataasee"'
                    processors:
                      - mapping: |
                          root.schemaVersion = 1
                          root.recordId = "dataasee"
                          root.name = "DatAasee"
                          root.creators = [{ "name": "C. Himpe"}]
                          root.publisher = "ULB Münster"
                          root.publicationYear = null
                          root.resourceType = "Software"
                          root.identifiers = [{ "name": "doi", "data": "10.5281/zenodo.13734194" }]
                          root.version = env("DL_VERSION")
                          root.relations = []

                      - resource: 'exports'

                  - check: 'metadata("id") != null'
                    processors:
                      - label: 'handler_metadata__arcadedb_query_id'
                        arcadedb:
                          host: '${DB_HOST}'
                          port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                          endpoint: 'query'
                          database: '${DB_NAME}'
                          username: '${DB_USER}'
                          password: '${DB_PASS}'
                          request: |
                            root.language = "sql"
                            root.params.recordid = metadata("id").string()
                            root.command = """SELECT *:{!@rid,!@type},
                                                     categories.transform('asRID').name AS categories,
                                                     source.data AS source,
                                                     resourceType.name AS resourceType,
                                                     language.name AS language,
                                                     license:{name,data} AS license,
                                                     description.ifempty(null) AS description,
                                                     keywords.ifempty(null) AS keywords,
                                                     $out[0].out || $inc[0].inc AS relations
                                              FROM metadata
                                              LET $out = (SELECT inE():{@type AS type,
                                                                        true AS isOut,
                                                                        outV().recordId AS recordId,
                                                                        outV().name AS name,
                                                                        outV().publicationYear AS publicationYear,
                                                                        outV().resourceType.name AS resourceType} AS out
                                                          FROM metadata
                                                          WHERE recordId = :recordid),
                                                  $inc = (SELECT outE():{@type AS type,
                                                                         false AS isOut,
                                                                         inV().recordId AS recordId,
                                                                         inV().name AS name,
                                                                         inV().publicationYear AS publicationYear,
                                                                         inV().resourceType.name AS resourceType} AS inc
                                                          FROM metadata
                                                          WHERE recordId = :recordid)
                                              WHERE recordId = :recordid;"""
                          response: |
                            root = this.result

                      - switch:
                          - check: 'this.length() == 0'
                            processors:
                              - mapping: |
                                  meta status = "404"
                                  root.errors = [ { "title": "Request Error: Not Found",
                                                    "detail": "Metadata record for requested identifier was not found." } ]

                          - processors:
                              - mapping: |
                                  root = this.0.without("related","selfies","visited")

                              - resource: 'exports'

                      - branch:
                          request_map: 'root = if this."@rid" != null { { "rid": this."@rid" } } else { deleted() }'
                          processors:
                            - label: 'handler_metadata__arcadedb_command_inc'
                              arcadedb:
                                host: '${DB_HOST}'
                                port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                                endpoint: 'command'
                                database: '${DB_NAME}'
                                username: '${DB_USER}'
                                password: '${DB_PASS}'
                                request: |
                                  root.language = "sql"
                                  root.command = "UPDATE %s SET numberViews += 1".format(this.rid)

                  - check: 'metadata("query") != null && metadata("language").lowercase().re_match("sql|mongo|gremlin|cypher|graphql")'
                    processors:
                      - label: 'handler_metadata__arcadedb_query_custom'
                        arcadedb:
                          host: '${DB_HOST}'
                          port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                          endpoint: 'query'
                          database: '${DB_NAME}'
                          username: '${DB_USER}'
                          password: '${DB_PASS}'
                          silent: true
                          request: |
                            root.language = metadata("language")
                            root.limit = 100
                            root.command = metadata("query")
                          response: |
                            if this.result != null {
                              root.result = this.result.array()
                            } else {
                              meta status = "400"
                              root.errors = [ { "title": this.error,
                                                "detail": this.detail } ]
                            }

                  - check: 'metadata("source") != null'
                    processors:
                      - label: 'handler_metadata__arcadedb_query_source'
                        arcadedb:
                          host: '${DB_HOST}'
                          port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                          endpoint: 'query'
                          database: '${DB_NAME}'
                          username: '${DB_USER}'
                          password: '${DB_PASS}'
                          request: |
                            root.language = "sql"
                            root.limit = 101
                            root.params.source = metadata("source").string().not_empty().catch("%")
                            root.params.format = metadata("format").or("").string().not_empty().catch("%")
                            root.params.skip = 100 * metadata("page").number(0)
                            root.command = """SELECT *:{!@rid,!@type},
                                                     related,
                                                     categories.transform('asRID').name AS categories,
                                                     resourceType.name AS resourceType,
                                                     language.name AS language,
                                                     license:{name,data} AS license
                                              FROM metadata
                                              WHERE (source.data LIKE :source) AND
                                                    (metadataFormat LIKE :format)
                                              SKIP :skip"""
                          response: |
                            root = this.result.slice(0,100).map_each(x -> x.without("visited"))
                            let query = "${DL_BASE}${DL_PATH}/metadata?source=" + metadata("source").string().escape_url_query()
                            let query = if metadata("format") != null { $query + "&format=" + metadata("format").string().escape_url_query() }
                            let query = $query + "&page="
                            meta links = { "first": $query + "0",
                                           "prev": if metadata("page").number(0) > 0 { $query +  [0,metadata("page").number(0) - 1].max().string() } else { deleted() },
                                           "next": if this.result.length() > 100 { $query + [0,metadata("page").number(0) + 1].max().string() } else { deleted() } }

                  - processors:
                      - label: 'handler_metadata__arcadedb_query_normal'
                        arcadedb:
                          host: '${DB_HOST}'
                          port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                          endpoint: 'query'
                          database: '${DB_NAME}'
                          username: '${DB_USER}'
                          password: '${DB_PASS}'
                          request: |
                            map prep_string {
                              root = this.or("").string().trim().replace_all("'","\\'")
                            }

                            # These bindings are made to ensure the prepared string is not empty
                            let resourcetype = metadata("resourcetype").apply("prep_string")
                            let language = metadata("language").apply("prep_string")
                            let license = metadata("license").apply("prep_string")
                            let category = metadata("category").apply("prep_string")
                            let format = metadata("format").apply("prep_string")
                            let doi = metadata("doi").apply("prep_string").trim_prefix("doi:").trim_prefix("https://doi.org/").trim_prefix("http://dx.doi.org/")
                            let search = metadata("search").apply("prep_string").not_empty().split(" ").map_each(x -> "(?=.*" + x.replace_all_many(["*",".*","_","\\\\s"]) + ")").join("").catch("")
                            let from = metadata("from").number().string().catch("")
                            let till = metadata("till").number().string().catch("")

                            let filter = "true "
                            let filter = if $resourcetype != "" { $filter + " AND (resourceType.name ILIKE '%s')".format($resourcetype) }
                            let filter = if $language != "" { $filter + " AND (language.name + language.data ILIKE '%%%s%%')".format($language) }
                            let filter = if $license != "" { $filter + " AND (license.name ILIKE '%s')".format($license) }
                            let filter = if $category != "" { $filter + " AND (ifnull(categories,[]).transform('asRID') CONTAINS (name ILIKE '%s'))".format($category) }
                            let filter = if $format != "" { $filter + " AND (metadataformat ILIKE '%s')".format($format) }
                            let filter = if $doi != "" { $filter + " AND (selfies CONTAINSANY ['%s'])".format($doi) }  # TODO: simplify DOI filter once CONTAINS uses by-item index
                            let filter = if $search != "" { $filter + " AND ((name MATCHES '(?is)%s.*') OR (keywords MATCHES '(?is)%[1]s.*') OR (description MATCHES '(?is)%[1]s.*'))".format($search) }
                            let filter = if $from != "" { $filter + " AND (publicationYear >= %s)".format($from) }
                            let filter = if $till != "" { $filter + " AND (publicationYear <= %s)".format($till) }

                            let newest = match metadata("newest").bool().catch(null) { true  => "ORDER BY publicationYear DESC",
                                                                                       false => "ORDER BY publicationYear ASC",
                                                                                       null  => "" }

                            root.language = "sql"
                            root.limit = 21
                            root.params.skip = 20 * metadata("page").number(0)
                            root.command = """SELECT recordId,
                                                     name,
                                                     publicationYear,
                                                     resourceType.name AS resourceType,
                                                     identifiers[name = 'doi'][0].data.prefix("https://doi.org/") AS doi,
                                                     metadataQuality
                                              FROM metadata
                                              WHERE %s
                                              %s
                                              SKIP :skip""".format($filter,$newest)
                          response: |
                            root = this.result.slice(0,20)
                            let query = "${DL_BASE}${DL_PATH}/metadata?"
                            let query = if metadata("resourcetype") != null { $query + "resourcetype=" + metadata("resourcetype").string().escape_url_query() + "&" }
                            let query = if metadata("language") != null { $query + "language=" + metadata("language").string().escape_url_query() + "&" }
                            let query = if metadata("license") != null { $query + "license=" + metadata("license").string().escape_url_query() + "&" }
                            let query = if metadata("format") != null { $query + "format=" + metadata("format").string().escape_url_query() + "&" }
                            let query = if metadata("category") != null { $query + "category=" + metadata("category").string().escape_url_query() + "&" }
                            let query = if metadata("doi") != null { $query + "doi=" + metadata("doi").string().escape_url_query() + "&" }
                            let query = if metadata("search") != null { $query + "search=" + metadata("search").string().escape_url_query() + "&" }
                            let query = if metadata("from") != null { $query + "from=" + metadata("from").string() + "&" }
                            let query = if metadata("till") != null { $query + "till=" + metadata("till").string() + "&" }
                            let query = if metadata("newest") != null { $query + "newest=" + metadata("newest").string() + "&" }
                            let query = $query + "page="
                            meta links = { "first": $query + "0",
                                           "prev": if metadata("page").number(0) > 0 { $query + [0,metadata("page").number(0) - 1].max().string() } else { deleted() },
                                           "next": if this.result.length() > 20 { $query + [0,metadata("page").number(0) + 1].max().string() } else { deleted() } }

              - label: 'handler_metadata__clean_results'
                mapping: |
                  map add_wrapper {
                    root = match {
                      this.type() == "object" => { "type": "data",
                                                   "id": timestamp_unix().string(),
                                                   "attributes": this.without("@rid","@type","@cat") }
                      this.type() == "array" => this.map_each(z -> z.apply("add_wrapper"))
                    }
                  }

                  root = if this.errors == null { { "data": this.apply("add_wrapper") } } else { this }

          - catch:
              - mapping: |
                  meta status = "500"
                  root.errors = [ { "title": "Server Error: Internal Server Error",
                                    "detail": "Database error." } ]
