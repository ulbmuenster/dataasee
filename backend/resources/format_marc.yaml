# Language: Benthos YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

processor_resources:
  - label: 'format_marc'
    try:
      - label: 'format_marc__get_payload'
        mapping: 'root = this.record'

      - label: 'format_marc__patch_sourceid'
        mapping: 'meta sourceid = if metadata("sourceid") == null { this.controlfield.filter(x -> x."-tag" == "001").0."#text" }'

      - label: 'format_marc__parser_workflow'
        workflow:
          meta_path: ''
          order:
            - - 'rawMetadata'
              - 'dataLocation'
              - 'name'
              - 'publisher'
              - 'publicationYear'
              - 'version'
              - 'language'
              - 'license'
              - 'resourceType'
              - 'keywords'
              - 'description'
              - 'rights'
              - 'creators'
              - 'identifiers'
              - 'subjects'
              - 'synonyms'
              - 'externalItems'
              - 'related'
            - - 'identifiers_1'
              - 'name_1'
              - 'publisher_1'
              - 'publicationYear_1'
              - 'resourceType_1'
              - 'language_1'
            - - 'gather'
          branches:

            # Raw String

            'rawMetadata':
              request_map: 'root = this.without("dataasee")'
              processors:
                - mapping: |
                    root.rawMetadata = { "record": this }.format_xml(no_indent: true).string()
              result_map: 'root.dataasee.rawMetadata = this.rawMetadata'

            # Filtered or First String

            'dataLocation':  # TODO map over all
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "856" && x."-ind1" == "4" && x."-ind2" == "0").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.dataLocation = this.0.subfield.array().filter(x -> x."-code" == "u").0."#text".catch(null)
              result_map: 'root.dataasee.dataLocation = this.dataLocation'

            'name':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "245").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.name = this.0.subfield.array().filter(x -> x."-code" == "a").0."#text".catch(null)
              result_map: 'root.dataasee.name = this.name | deleted()'

            'publisher':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "260").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.publisher = this.0.subfield.array().filter(x -> x."-code" == "b").0."#text".catch(null)
              result_map: 'root.dataasee.publisher = this.publisher | deleted()'

            'publicationYear':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "260").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.publicationYear = this.0.subfield.array().filter(x -> x."-code" == "c").0."#text".catch(null)
              result_map: 'root.dataasee.publicationYear = this.publicationYear | deleted()'

            'version':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "250").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.version = this.0.subfield.array().filter(x -> x."-code" == "a").0."#text".catch(null)
              result_map: 'root.dataasee.version = this.version | deleted()'

            'language':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "041").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.language = this.0.subfield.array().filter(x -> x."-code" == "a").0."#text".catch(null)
              result_map: 'root.dataasee.language = this.language | deleted()'

            'license':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("506|540")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.license = this.0.subfield.array().filter(y -> y."-code".re_match("f|u")).0."#text".catch(null)
              result_map: 'root.dataasee.license = this.license | deleted()'

            'resourceType':
              request_map: 'root = this.controlfield.array().filter(x -> x."-tag" == "007").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.resourceType = match {
                                                this.0."#text".slice(0,1) == "a" => "Image",
                                                this.0."#text".slice(0,1) == "c" => "Software",
                                                this.0."#text".slice(0,1) == "d" => "PhysicalObject",
                                                this.0."#text".slice(0,1) == "f" => "Text",
                                                this.0."#text".slice(0,1) == "g" => "Image",
                                                this.0."#text".slice(0,1) == "h" => "Text",
                                                this.0."#text".slice(0,1) == "k" => "Image",
                                                this.0."#text".slice(0,1) == "m" => "Audiovisual",
                                                this.0."#text".slice(0,1) == "o" => "Other",
                                                this.0."#text".slice(0,1) == "q" => "Text",
                                                this.0."#text".slice(0,1) == "r" => "Audiovisual",
                                                this.0."#text".slice(0,1) == "s" => "Sound",
                                                this.0."#text".slice(0,1) == "t" => "Text",
                                                this.0."#text".slice(0,1) == "v" => "Audiovisual",
                                                this.0."#text".slice(0,1) == "z" => "Other",
                                                _                                => null
                                              }
              result_map: 'root.dataasee.resourceType = this.resourceType | deleted()'

            # Concatenate Strings

            'keywords':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "653").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = ","
                    root.keywords = this.map_each(x -> x.subfield.array().filter(y -> y."-code" == "a").map_each(y -> y."#text")).flatten().filter(x -> x != "").join($sep)
              result_map: 'root.dataasee.keywords = this.keywords.not_empty().catch(deleted())'

            'description':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("500|520")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = "\n---\n"
                    root.description = this.map_each(x -> x.subfield.array().filter(y -> y."-code" == "a").map_each(y -> y."#text")).flatten().filter(x -> x != "").join($sep)
              result_map: 'root.dataasee.description = this.description.not_empty().catch(deleted())'

            'rights':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("506|540")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = "\n---\n"
                    root.rights = this.map_each(x -> x.subfield.array().filter(y -> y."-code".re_match("a|f")).map_each(y -> y."#text")).flatten().join($sep)
              result_map: 'root.dataasee.rights = this.rights.not_empty().catch(deleted())'

            # Array

            'creators':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("100|700")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.creators = this.map_each(x -> x.subfield.array().fold({},y -> y.tally.assign(match y.value { this."-code" == "a" => { "name": this."#text" },
                                                                                                                      this."-code" == "0" => { "data": this."#text" } } ) ) ).filter(x -> x != {})
              result_map: 'root.dataasee.creators = this.creators | deleted()'

            'identifiers':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("020|024|856")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.identifiers = this.map_each(x -> { "name": if x."-tag" == "020" { "isbn" } else { null },
                                                            "data": x.subfield.array().filter(y -> y."-code" == "a").0."#text".catch(deleted()) }).filter(x -> x.data != null)
              result_map: 'root.dataasee.identifiers = this.identifiers.not_empty().catch(deleted())'

            'subjects':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("655|689")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.subjects = this.map_each(x -> { "name": x.subfield.array().filter(y -> y."-code" == "a").0."#text".catch(deleted()),
                                                         "data": x.subfield.array().filter(y -> y."-code" == "0").0."#text".catch(deleted()) }).filter(x -> x.name != null)
              result_map: 'root.dataasee.subjects = this.subjects.not_empty().catch(deleted())'

            'synonyms':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("210|222|240|242|243|246|247")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.synonyms = this.map_each(x -> { "name": match x { this."-tag" == "210" => "abbreviated",
                                                                           this."-tag" == "222" => "key Title",
                                                                           this."-tag" == "240" => "uniform",
                                                                           this."-tag" == "242" => "translated",
                                                                           this."-tag" == "243" => "translated",
                                                                           this."-tag" == "246" => "alternative",
                                                                           this."-tag" == "247" => "former" },
                                                         "data": x.subfield.array().filter(y -> y."-code" == "a").0."#text".catch(deleted()) }).filter(x -> x.data != null)
              result_map: 'root.dataasee.synonyms = this.synonyms.not_empty().catch(deleted())'

            'externalItems':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag" == "856" && x."-ind1" == "4" && x."-ind2" == "2").not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.externalItems = this.map_each(x -> { "name": "related",
                                                              "data": x.subfield.array().filter(y -> y."-code" == "u").0."#text".catch(deleted()) }).filter(x -> x.data != null)
              result_map: 'root.dataasee.externalItems = this.externalItems.not_empty().catch(deleted())'

            # Object

            'related':
              request_map: 'root = this.datafield.not_null().array().filter(x -> x."-tag".re_match("773|780|785|786|787")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.related = this.fold({},x -> x.tally.merge({ match x.value { this."-tag" == "773" => "isPartOf",
                                                                                     this."-tag" == "780" => "isRelatedTo",
                                                                                     this."-tag" == "785" => "isRelatedTo",
                                                                                     this."-tag" == "786" => "isRelatedTo",
                                                                                     this."-tag" == "787" => "isRelatedTo" }: x.value.subfield.array().filter(y -> y."-code" == "u").not_empty().map_each(y -> y."#text").catch(deleted()) }))
              result_map: 'root.dataasee.related = this.related.not_empty().catch(deleted())'

            # Additionals

            'identifiers_1':
              request_map: 'root = this.controlfield.array().filter(x -> x."-tag".re_match("001|003")).not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.identifiers = [{ "name": this.filter(x -> x."-tag" == "003").0."#text" | "control number",
                                          "data": this.filter(x -> x."-tag" == "001").0."#text" }]
              result_map: 'root.dataasee.identifiers = this.identifiers.concat(root.dataasee.identifiers.or([]))'

            # Alternates

            'name_1':
              request_map: 'root = if this.dataasee.name == null { this.datafield.not_null().array().filter(x -> x."-tag" == "130").not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    root.name = this.0.subfield.array().filter(x -> x."-code" == "a").0."#text".catch(null)
              result_map: 'root.dataasee.name = this.name | deleted()'

            'publisher_1':
              request_map: 'root = if this.dataasee.publisher == null { this.datafield.not_null().array().filter(x -> x."-tag" == "264").not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    root.publisher = this.filter(x -> x."-ind2" == "1").not_empty().catch(this).0.subfield.array().filter(x -> x."-code" == "b").0."#text".catch(null)
              result_map: 'root.dataasee.publisher = this.publisher | deleted()'

            'publicationYear_1':
              request_map: 'root = if this.dataasee.publicationYear == null { this.datafield.not_null().array().filter(x -> x."-tag" == "264").not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    root.publicationYear = this.filter(x -> x."-ind2" == "1").not_empty().catch(this).0.subfield.array().filter(x -> x."-code" == "c").0."#text".catch(null)
              result_map: 'root.dataasee.publicationYear = this.publicationYear | deleted()'

            'resourceType_1':
              request_map: 'root = if this.dataasee.resourceType == null { this.datafield.not_null().array().filter(x -> x."-tag" == "337").not_empty().0.catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    root.resourceType = match this.subfield.array().filter(x -> x."-code" == "b").0 {
                                                this."#text" == "s" => "Sound",
                                                this."#text" == "h" => "Image",
                                                this."#text" == "n" => "Text",
                                                this."#text" == "p" => "Image",
                                                this."#text" == "g" => "Audiovisual",
                                                this."#text" == "v" => "Audiovisual",
                                                this."#text" == "c" => "InteractiveResource",
                                                this."#text" == "x" => "Other",
                                                this."#text" == "z" => "Other",
                                                this."#text" == "e" => "Image",
                                                _                   => null
                                              }
              result_map: 'root.dataasee.resourceType = this.resourceType | deleted()'

            'language_1':
              request_map: 'root = if this.dataasee.language == null { this.controlfield.array().filter(x -> x."-tag" == "008").not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    let language = this.0."#text".slice(35,38).catch("###")
                    root.language = if ["###","|||","mul"].contains($language) { null } else { $language }
              result_map: 'root.dataasee.language = this.language | deleted()'

            # Finalize

            'gather':
              request_map: 'root = this'
              processors:
                - noop: {}
              result_map: 'root = this.dataasee'
