processor_resources:
  - label: 'method_self'
    while:
      at_least_once: true
      max_loops: 0
      check: 'metadata("page") != null'
      processors:
        - try:
            - http:
                url: '${! metadata("ingest").source + "/api/v1/metadata?source=%25&format=%25&page=" + metadata("page").or(0).string() }'
                verb: 'GET'
                timeout: '10s'
                retries: 3

            - mapping: |
                meta page = if this.data.length() < 100 { null } else { metadata("page").or(0) + 1 }

                root = this.data

            - unarchive:
                format: 'json_array'

            - mapping: 'root = this.attributes'

            - mapping: 'meta sourceid = this.recordId'

            - try:
                - resource: 'normalize'

                - resource: 'process'

            - catch:
                - log:
                    message: |
                      ${! error() + " : " + this.rawMetadata.or("").replace_all_many(["\"","'","\\u003c","<","\\u003e",">"]) }

                - mapping: 'root = {}'

            - archive:
                format: 'json_array'

            - resource: 'submit'

        - catch: []
