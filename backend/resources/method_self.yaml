processor_resources:
  - label: 'method_self'
    while:
      at_least_once: true
      max_loops: 0
      check: 'metadata("page") != null && !errored()'
      processors:
        - http:
            url: '${! metadata("ingest").source + "/api/v1/metadata?source=&page=" + metadata("page").or(0).string() }'
            verb: 'GET'
            timeout: '10s'
            retries: 3

        - switch:
            - check: '!errored()'  # for HTTP error
              processors:
                - mapping: |
                    meta page = this.links.next.split("page=").index(1).catch(null)

                    root = this.data

                - unarchive:
                    format: 'json_array'

                - mapping: 'root = this.attributes'

                - try:
                    - resource: 'normalize'

                    - mutation: |
                        root.source = metadata("source_rid")
                        root.visited = false

                - catch:
                    - log:
                        message: |
                          ${! error() + " : " + this.rawMetadata.or("").replace_all_many(["\"","'","\\u003c","<","\\u003e",">"]) }

                    - mapping: 'root = {}'

                - resource: 'submit'
