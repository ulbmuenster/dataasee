processor_resources:
  - label: 'handler_schema'
    processors:
      - cached:
          cache: 'global_cache'
          key: 'schema'
          processors:
            - label: 'handler_schema__arcadedb_query'
              arcadedb:
                host: '${DB_HOST}'
                port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                endpoint: 'query'
                database: '${DB_NAME}'
                username: '${DB_USER}'
                password: '${DB_PASS}'
                request: |
                  root.language = "sql"
                  root.command = """SELECT map(schemas) AS `schema`
                                    FROM (SELECT $edges.edges || $props.props || $infos.infos AS schemas
                                          LET $props = (SELECT map(name, custom) AS props
                                                        FROM (SELECT expand(properties)
                                                              FROM schema:types
                                                              WHERE name = 'metadata')
                                                        WHERE name <> 'related' AND
                                                              name <> 'visited' AND
                                                              name <> 'selfies'),
                                              $edges = (SELECT map("@" + name, custom) AS edges
                                                        FROM schema:types
                                                        WHERE type = 'edge'),
                                              $infos = (SELECT map("@comment",custom.comment,"@version",custom.version) AS infos
                                                        FROM schema:types
                                                        WHERE name = 'metadata')
                                    UNWIND schemas)"""
                response: |
                  root.data.type = "support"
                  root.data.id = timestamp_unix().string()
                  root.data.attributes = this.result.0.schema

      - catch:
          - mapping: |
              meta status = "500"
              root.errors = [ { "title": "Server Error: Internal Server Error",
                                "detail": "Database error." } ]
