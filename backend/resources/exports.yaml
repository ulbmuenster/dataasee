processor_resources:
  - label: 'exports'
    switch:
      - check: 'metadata("format").or("").lowercase() == "bibjson"'
        processors:
          - resource: 'export_bibjson'

      - check: 'metadata("format").or("").lowercase() == "datacite"'
        processors:
          - resource: 'export_datacite'
