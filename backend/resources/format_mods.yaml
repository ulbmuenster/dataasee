# Language: Benthos YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

processor_resources:
  - label: 'format_mods'
    try:
      - label: 'format_mods__get_payload'
        mapping: 'root = this.mods'

      - label: 'format_mods__patch_sourceid'
        mapping: 'meta sourceid = if metadata("sourceid") == null { this.recordInfo.recordIdentifier."#text".catch(deleted()) }'

      - label: 'format_mods__explode_dates'
        mapping: 'root = if this.originInfo.type() == "array" { this.explode("originInfo") } else { [this] }'

      - label: 'format_mods__split_array'
        unarchive:
          format: 'json_array'

      - label: 'format_mods__parser_workflow'
        workflow:
          meta_path: ''
          order:
            - - 'rawMetadata'
              - 'rawFormat'
              - 'dataLocation'
              - 'title'
              - 'publisher'
              - 'publicationYear'
              - 'resourceType'
              - 'version'
              - 'license'
              - 'language'
              - 'description'
              - 'rights'
              - 'keywords'
              - 'creators'
              - 'identifiers'
              - 'synonyms'
              - 'subjects'
              - 'relatedItems'
              - 'related'
            - - 'title_1'
              - 'publicationYear_1'
              - 'resourceType_1'
              - 'creators_1'
              - 'identifiers_1'
              - 'subjects_1'
              - 'keywords_1'
              - 'description_1'
            - - 'gather'
          branches:

            # Raw String

            'rawMetadata':
              request_map: 'root = this.without("dataasee")'
              processors:
                - mapping: |
                    root.rawMetadata = { "mods": this }.format_xml(no_indent: true).string()
              result_map: 'root.dataasee.rawMetadata = this.rawMetadata'

            # Raw Format

            'rawFormat':
              request_map: 'root = {}'
              processors:
                - mapping: |
                    root.rawFormat = "mods+xml"
              result_map: 'root.dataasee.rawFormat = this.rawFormat'

            # Filtered or First String

            'dataLocation':
              request_map: 'root = this.location.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.filter(x -> x.exists("url")).not_empty().0.catch(null)
                    root.dataLocation = $first.url."#text" | $first.url
              result_map: 'root.dataasee.dataLocation = this.dataLocation | deleted()'

            'title':
              request_map: 'root = this.titleInfo.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let titleinfo = this.filter(x -> !x.exists("-type") && !x.exists("-otherType")).not_empty().catch(this).0

                    let title = if $titleinfo.exists("title") { [$titleinfo.title.array().0."#text" | $titleinfo.title.array().0.string()] } else { [] }
                    let subtitles = if $titleinfo.exists("subTitle") { [$titleinfo.subTitle.array().map_each(x -> x."#text" | x.string()).join(", ")] } else { [] }
                    let partnumbers = if $titleinfo.exists("partNumber") { [$titleinfo.partNumber.array().map_each(x -> x."#text" | x.string()).join(", ")] } else { [] }
                    let partnames = if $titleinfo.exists("partName") { [$titleinfo.partName.array().map_each(x -> x."#text" | x.string()).join(", ")] } else { [] }

                    root.title = $title.concat($subtitles).concat($partnumbers).concat($partnames).join(" - ")
              result_map: 'root.dataasee.title = this.title.not_empty().catch(null)'

            'publisher':
              request_map: 'root = this.originInfo.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.0
                    root.publisher = match { $first.publisher.type() == "object" => $first.publisher."#text",
                                             $first.publisher.type() == "string" => $first.publisher,
                                             $first.publisher.type() == "array"  => $first.publisher.unique().map_each(x -> x."#text" | x.string()).join("; ") }
              result_map: 'root.dataasee.publisher = this.publisher'

            'publicationYear':
              request_map: 'root = this.originInfo.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.0
                    root.publicationYear = match { $first.dateIssued.type() == "array"    => $first.dateIssued.fold(null,x -> if x.value."-encoding".or("").lowercase() == "w3cdtf" { x.value."#text" | x.value.string() } else { x.tally.or(x.value."#text" | x.value.string()) }),
                                                   $first.dateIssued.type() == "object"   => $first.dateIssued."#text",
                                                   $first.dateIssued.type() == "string"   => $first.dateIssued,
                                                   $first.dateCreated.type() == "array"   => $first.dateCreated.fold(null,x -> if x.value."-encoding".or("").lowercase() == "w3cdtf" { x.value."#text" | x.value.string() } else { x.tally.or(x.value."#text" | x.value.string()) }),
                                                   $first.dateCreated.type() == "object"  => $first.dateCreated."#text",
                                                   $first.dateCreated.type() == "string"  => $first.dateCreated,
                                                   $first.dateCaptured.type() == "array"  => $first.dateCaptured.fold(null,x -> if x.value."-encoding".or("").lowercase() == "w3cdtf" { x.value."#text" | x.value.string() } else { x.tally.or(x.value."#text" | x.value.string()) }),
                                                   $first.dateCaptured.type() == "object" => $first.dateCaptured."#text",
                                                   $first.dateCaptured.type() == "string" => $first.dateCaptured,
                                                   $first.dateOther.type() == "array"     => $first.dateOther.fold(null,x -> if x.value."-encoding".or("").lowercase() == "w3cdtf" { x.value."#text" | x.value.string() } else { x.tally.or(x.value."#text" | x.value.string()) }),
                                                   $first.dateOther.type() == "object"    => $first.dateOther."#text",
                                                   $first.dateOther.type() == "string"    => $first.dateOther,
                                                   _                                      => null }
              result_map: 'root.dataasee.publicationYear = this.publicationYear | deleted()'

            'resourceType':
              request_map: 'root = this.typeOfResource.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this
                    let first = this.filter(x -> x."#text".or(x.string()).lowercase() == "text").not_empty().catch($first).0
                    root.resourceType = $first."#text" | $first.string()
              result_map: 'root.dataasee.resourceType = this.resourceType'

            'version':
              request_map: 'root = this.originInfo.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.0.edition
                    root.version = $first."#text" | $first  # Do not use ".string() here since it may not exist"
              result_map: 'root.dataasee.version = this.version'

            'language':
              request_map: 'root = this.language.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.0.languageTerm.array().0
                    root.language = $first."#text" | $first.string()
              result_map: 'root.dataasee.language = this.language'

            'license':
              request_map: 'root = this.accessCondition.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.filter(x -> x.exists("-href") || x.exists("-valueURI")).not_empty().0.catch(null)
                    root.license = $first."-href" | $first."-valueURI"
              result_map: 'root.dataasee.license = this.license | deleted()'

            # Concatenated Strings

            'description':
              request_map: 'root = this.abstract.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = " ¶ "
                    root.description = this.map_each(x -> x."#text" | x.string()).join($sep)
              result_map: 'root.dataasee.description = this.description'

            'rights':
              request_map: 'root = this.accessCondition.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = " ¶ "
                    root.rights = this.map_each(x -> x."#text" | x.string()).join($sep)
              result_map: 'root.dataasee.rights = this.rights'

            # Array

            'keywords':
              request_map: 'root = this.subject.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let keywords = this.map_each(x -> x.filter(y -> y.key.re_match("^(?i)(topic|geographic|temporal|genre|occupation)$")).values()).flatten().flatten()
                    root.keywords = $keywords.filter(x -> !x.exists("-valueURI")).map_each(x -> x."#text" | x.string())
              result_map: 'root.dataasee.keywords = this.keywords'

            'creators':
              request_map: 'root = this.name.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let creators = this.filter(x -> x.exists("displayForm") || x.exists("namePart"))
                    root.creators = $creators.map_each(x -> { "name": x.displayForm."#text" | x.displayForm | x.namePart."#text" | x.namePart.fold("",y -> match y.value { this."-type" == "family" => this."#text" + y.tally,
                                                                                                                                                                           this."-type" == "given"  => y.tally + ", " + this."#text",
                                                                                                                                                                           _                        => y.tally }).catch(x.namePart.string()),
                                                              "data": x.nameIdentifier."#text" | x.nameIdentifier | x."-valueURI" | deleted() })
              result_map: 'root.dataasee.creators = this.creators.not_empty().catch(deleted())'

            'identifiers':
              request_map: 'root = this.identifier.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.identifiers = this.map_each(x -> { "name": x."#text" | x.string(),
                                                            "data": x."-type" })
              result_map: 'root.dataasee.identifiers = this.identifiers'

            'synonyms':
              request_map: 'root = this.titleInfo.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let main = this.filter(x -> !x.exists("-type") && !x.exists("-otherType")).0.catch(null)
                    let synonyms = this.filter(x -> x != $main).map_each(x -> { "type": x."-type" | x."-otherType" | "alternative",
                                                                                "title": if x.exists("title") { [x.title.array().0."#text" | x.title.array().0.string()] } else { [] },
                                                                                "subtitles": if x.exists("subTitle") { [x.subTitle.array().map_each(y -> y."#text" | y.string()).join(", ")] } else { [] },
                                                                                "partnumbers": if x.exists("partNumber") { [x.partNumber.array().map_each(y -> y."#text" | y.string()).join(", ")] } else { [] },
                                                                                "partnames": if x.exists("partName") { [x.partName.array().map_each(y -> y."#text" | y.string()).join(", ")] } else { [] } } )
                    root.synonyms = if $synonyms.length() > 0 { $synonyms.map_each(x -> { "name": x.title.concat(x.subtitles).concat(x.partnumbers).concat(x.partnames).join(" - "),
                                                                                          "data": x.type, }) } else { [] }
              result_map: 'root.dataasee.synonyms = this.synonyms.not_empty().catch(deleted())'

            'subjects':
              request_map: 'root = this.subject.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let subjects = this.map_each(x -> x.filter(y -> y.key.re_match("^(?i)(topic|geographic|temporal|genre|occupation)$")).values()).flatten().flatten()
                    root.subjects = $subjects.map_each(x -> { "name": x."#text" | x.string(),
                                                              "data": x."-valueURI" })
              result_map: 'root.dataasee.subjects = this.subjects'

            'relatedItems':
              request_map: 'root = this.relatedItem.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let related = this.filter(x -> x.exists("location") || x.exists("-href"))
                    root.relatedItems = $related.map_each(x -> { "name": x."-type" | "related",
                                                                 "data": x.location.array().0.url.array().0."#text" | x.location.array().0.url.array().0 | x."-href" })
              result_map: 'root.dataasee.relatedItems = this.relatedItems.not_empty().catch(deleted())'

            # Object

            'related':
              request_map: 'root = this.relatedItem.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let related = this.filter(x -> x.exists("identifier") || x.exists("recordInfo") || x.exists("-href"))
                    let related = $related.map_each(x -> { "name": x."-type",
                                                           "data": match x { this.exists("identifier") => this.identifier.array().0,
                                                                             this.exists("recordInfo") => this.recordInfo.recordIdentifier,
                                                                             this.exists("-href")      => this."-href" } })

                    root.related = $related.fold({},x -> x.tally.merge({ match x.value.name { "host"         => "isPartOf",
                                                                                              "preceding"    => "isNewVersionOf",
                                                                                              "original"     => "isDerivedFrom",
                                                                                              "otherVersion" => "isDerivedFrom",
                                                                                              "otherFormat"  => "commonExpression",
                                                                                              _              => "isRelatedTo" }: x.value.data."#text" | x.value.data.string() }))
              result_map: 'root.dataasee.related = this.related'

            # Alternates

            'title_1':
              request_map: 'root = if this.dataasee.title == null { this.part.not_null().array().not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    let detail = this.0.detail.array().0
                    root.title = $detail.title."#text" | $detail.title | $detail.caption."text" | $detail.caption
              result_map: 'root.dataasee.title = this.title | deleted()'

            'publicationYear_1':
              request_map: 'root = if this.dataasee.publicationYear == null { this.part.not_null().date.not_null().array().not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    let first = this.0
                    root.publicationYear = $first."#text" | $first.string()
              result_map: 'root.dataasee.publicationYear = this.publicationYear'

            'resourceType_1':
              request_map: 'root = if this.dataasee.resourceType == null { this.genre.not_null().array().not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    let first = this.0
                    root.resourceType = $first."#text" | $first.string()
              result_map: 'root.dataasee.resourceType = this.resourceType | deleted()'

            'creators_1':
              request_map: 'root = if this.dataasee.creators == null { this.relatedItem.not_null().array().not_empty().catch(deleted()) } else { deleted() }'
              processors:
                - mapping: |
                    let host = this.filter(x -> x."-type" == "host")
                    let otherFormat = this.filter(x -> x."-type" == "otherFormat")
                    let related = match { $host != []        => $host.0.name.array(),
                                          $otherFormat != [] => $otherFormat.0.name.array(),
                                          _                  => [] }.filter(x -> x.exists("displayForm") || x.exists("namePart"))

                    root.creators = $related.map_each(x -> { "name": x.displayForm."#text" | x.displayForm | x.namePart."#text" | x.namePart.fold("",y -> match y.value { this."-type" == "family" => this."#text" + y.tally,
                                                                                                                                                                          this."-type" == "given"  => y.tally + ", " + this."#text",
                                                                                                                                                                          _                        => y.tally }).catch(x.namePart.string()),
                                                             "data": x.nameIdentifier."#text" | x.nameIdentifier | x."-valueURI" | deleted() })
              result_map: 'root.dataasee.creators = this.creators.not_empty().catch(deleted())'

            # Additionals

            'identifiers_1':
              request_map: 'root = this.recordInfo.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.identifiers = this.map_each(x -> { "name": x.recordIdentifier."#text" | x.recordIdentifier.string(),
                                                            "data": x.recordIdentifier."-source" | "recordIdentifier" })
              result_map: 'root.dataasee.identifiers = root.dataasee.identifiers.or([]).concat(this.identifiers)'

            'subjects_1':
              request_map: 'root = this.classification.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.subjects = this.filter(x -> x.exists("-valueURI")).map_each(x -> { "name": x."#text" | x.string(),
                                                                                            "data": x."-valueURI" })
              result_map: 'root.dataasee.subjects = root.dataasee.subjects.or([]).concat(this.subjects)'

            'keywords_1':
              request_map: 'root = this.classification.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.keywords = this.filter(x -> !x.exists("-valueURI")).map_each(x -> x."#text" | x.string())
              result_map: 'root.dataasee.keywords = root.dataasee.keywords.or([]).concat(this.keywords)'

            'description_1':
              request_map: 'root = this.note.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = "\n---\n"
                    root.description = this.map_each(x -> x."#text" | x.string()).join($sep)
              result_map: 'root.dataasee.description = (root.dataasee.description.or("") + "\n---\n" + this.description).trim("\n---\n")'

            # Finalize

            'gather':
              request_map: 'root = this'
              processors:
                - noop: {}
              result_map: 'root = this.dataasee'
