processor_resources:
  - label: 'handler_ingest'
    processors:
      - label: 'handler_ingest__cache_lock'
        branch:
          processors:
            - cache:
                resource: 'global_cache'
                operator: 'exists'
                key: 'ingesting'
          result_map: 'meta ingesting = this'

      - switch:
          - check: 'content().string().trim() == "" || this.catch(null) == {}'
            processors:
              - mapping: |
                  meta status = "200"
                  root.data.type = "system"
                  root.data.id = timestamp_unix().string()
                  root.data.attributes.started = metadata("ingesting").bool()

          - check: 'metadata("ingesting")'
            processors:
              - mapping: |
                  meta status = "503"
                  root.errors = [ { "title": "Server error: Service Unavailable",
                                    "detail": "Already ingesting." } ]

          - processors:
              - try:
                  - label: 'handler_ingest__filter_body'
                    mapping: |
                      root = this.catch({}).with("username","password")
                      root.source = this.source.or("").trim()
                      root.steward = this.steward.or("").trim()
                      root.method = this.method.or("").trim().lowercase()
                      root.format = this.format.or("").trim().lowercase()
                      root.rights = this.rights.or("").trim()
                      root.options = this.options.or("").trim().trim("&")

                  - label: 'handler_ingest__validate_body'
                    json_schema:
                      schema_path: 'file:///schemas/request/ingest.json'

                  - label: 'handler_ingest__preserve_body'
                    mapping: |
                      meta ingest = this

                  - label: 'handler_ingest__set_lock'
                    cache:
                      resource: 'global_cache'
                      operator: 'set'
                      key: 'ingesting'

                  - mapping: |
                      meta status = "202"
                      root.data.type = "system"
                      root.data.id = timestamp_unix().string()
                      root.data.attributes.started = true

              - catch:
                  - mapping: |
                      meta status = "400"
                      root.errors = [ { "title": "Request Error: Bad Request",
                                        "detail": "Request failed to pass schema validation.", "links": { "about": "${DL_BASE}${DL_PATH}/api?request=ingest" } } ]


  - label: 'handler_ingest_async'
    processors:
      - switch:
          - check: 'metadata("ingest") != null'
            processors:
              - log:
                  message: 'Ingest started from ${! metadata("ingest").source } via ${! metadata("ingest").method } as ${! metadata("ingest").format }.'

              - mapping: |
                  meta timer_start = timestamp_unix()
                  meta count = 0
                  meta failed = 0

              - label: 'handler_ingest_async__arcadedb_insert_source'
                arcadedb:
                  host: '${DB_HOST}'
                  port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                  endpoint: 'command'
                  database: '${DB_NAME}'
                  username: '${DB_USER}'
                  password: '${DB_PASS}'
                  request: |
                    root.language = "sql"
                    root.params.name = metadata("timer_start").ts_format("2006-01-02 15:04:05", "UTC")
                    root.params.data = metadata("ingest").source
                    root.command = "INSERT INTO sources SET name = :name, data = :data"
                  response: |
                    meta source_rid = this.result.0."@rid"

              - resource: 'methods'

              - log:
                  message: 'Ingest completed from ${! metadata("ingest").source } of ${! metadata("count").string() } records (of which ${! metadata("failed").string() } failed) after ${! "%.1f".format((timestamp_unix() - metadata("timer_start")) / 3600.0) }h.'

              - resource: 'interconnect'

              - log:
                  message: 'Interconnect started asynchronously in database. See database log for details.'

              - mapping: |
                  meta ingest = deleted()

              - label: 'async_ingest__clear_lock_after_finish'
                cache:
                  resource: 'global_cache'
                  operator: 'delete'
                  key: 'ingesting'
