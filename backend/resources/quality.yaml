processor_resources:
  - label: 'quality'
    branch:
      request_map: 'root = this.with("title","creators","publisher","publicationYear","resourceType","identifiers")'
      processors:
        - mapping: 'root.metadataQuality = if this.values().contains(null) || this.title == "" { "Incomplete" } else { "OK" }'
      result_map: 'root.metadataQuality = this.metadataQuality'
