processor_resources:
  - label: 'handler_health'
    processors:
      - branch:
          processors:
            - try:
                - label: 'handler_health__arcadedb_health'
                  arcadedb:
                    host: '${DB_HOST}'
                    port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                    endpoint: 'query'
                    database: '${DB_NAME}'
                    username: '${DB_USER}'
                    password: '${DB_PASS}'
                    request: |
                      root.language = "sql"
                      root.command = """SELECT {"records": count(*),
                                                "interconnecting": ifnull($interlock, false)} AS report,
                                               version().split(' ')[0] AS version
                                        FROM Metadata;"""
                    response: |
                      root.report = this.result.0.report
                      root.version = this.result.0.version
                      root.healthy = true

            - catch:
                - mapping: 'root.healthy = false'

          result_map: |
            root.database = this
            root.database.name = "ArcadeDB"

      - branch:
          processors:
            - try:
                - label: 'handler_health__benthos_health'
                  http:
                    url: 'http://localhost:4195/version'
                    verb: 'GET'

                - mapping: |
                    root.version = this.version
                    root.healthy = true

                - label: 'handler_health__benthos_ingesting'
                  branch:
                    processors:
                      - cache:
                          resource: 'global_cache'
                          operator: 'exists'
                          key: 'ingesting'
                    result_map: 'root.report.ingesting = this'

            - catch:
                - mapping: 'root.healthy = false'

          result_map: |
            root.processor = this
            root.processor.name = "Benthos"

      - switch:
          - check: 'this.processor.healthy'
            processors:
              - mapping: |
                  root.data.type = "system"
                  root.data.id = timestamp_unix().string()
                  root.data.attributes.database = this.database
                  root.data.attributes.processor = this.processor

          - processors:
              - mapping: |
                  meta status = "500"
                  root.errors = [{"title": "Server Error: Internal Server Error",
                                  "detail": "Service not healthy."}]
