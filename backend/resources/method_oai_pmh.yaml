processor_resources:
  - label: 'method_oai_pmh'
    processors:
      - label: 'oai_pmh_loop'
        while:
          at_least_once: true
          max_loops: 0
          check: 'metadata("resumptionToken").type() != "null" && !errored()'
          processors:
            - http:
                url: '${! metadata("ingest").source + "?verb=ListRecords&" + metadata("resumptionToken").or("metadataPrefix=" + metadata("ingest").format + "&" + metadata("ingest").options).trim_suffix("&") }'
                verb: 'GET'
                timeout: '20s'
                retries: 10
                retry_period: '30s'
                rate_limit: 'rl__oai_pmh'

            - switch:
                - check: '!errored()'  # for HTTP error
                  processors:
                    - xml:
                        operator: 'to_json'

                    - mapping: |
                        root = if this."OAI-PMH".error == null { this."OAI-PMH".ListRecords.record.array().filter(x -> x.exists("metadata")) } else { throw(this."OAI-PMH".error."-code") }

                        meta resumptionToken = match this."OAI-PMH".ListRecords.resumptionToken."#text" {
                                                  this.type() == "null" => null,
                                                                      _ => "resumptionToken=" + this }

                    - switch:
                        - check: '!errored()'  # for OAI-PMH error
                          processors:
                            - unarchive:
                                format: 'json_array'

                            - mapping: 'meta sourceid = this.header.identifier'

                            - mapping: 'root = this.metadata'

                            - try:
                                - resource: 'formats'

                                - resource: 'normalize'

                                - resource: 'process'

                            - catch:
                                - log:
                                    message: |
                                      ${! error() + " : " + this.rawMetadata.or("").replace_all_many(["\"","'","\\u003c","<","\\u003e",">"]) }

                                - mapping: 'root = {}'

                            - resource: 'submit'

                            - sleep:
                                duration: "0.1s"

rate_limit_resources:
  - label: 'rl__oai_pmh'
    local:
      count: 60
      interval: '1m'
