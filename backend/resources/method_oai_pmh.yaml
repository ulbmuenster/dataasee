processor_resources:
  - label: 'method_oai_pmh'
    while:
      at_least_once: true
      max_loops: 0
      check: 'metadata("resumptionToken").type() != "null"'
      processors:
        - http:
            url: '${! metadata("ingest").source + "?verb=ListRecords&" + metadata("resumptionToken").or("metadataPrefix=" + metadata("ingest").format + "&" + metadata("ingest").options).trim_suffix("&") }'
            verb: 'GET'
            timeout: '20s'
            retries: 10
            retry_period: '30s'
            rate_limit: 'rl__oai_pmh'

        - switch:
            - check: '!errored()'
              processors:
                - xml:
                    operator: 'to_json'

                - mapping: |
                    meta resumptionToken = match this."OAI-PMH".ListRecords.resumptionToken."#text" {
                                              this.type() == "null" => null,
                                                                  _ => "resumptionToken=" + this }
                    root = this."OAI-PMH".ListRecords.record.array().filter(x -> x.exists("metadata"))

                - unarchive:
                    format: 'json_array'

                - mapping: 'meta sourceid = this.header.identifier'

                - mapping: 'root = this.metadata'

                - try:
                    - resource: 'formats'

                    - resource: 'normalize'

                    - resource: 'process'

                - catch:
                    - log:
                        message: |
                          ${! error() + " : " + this.rawMetadata.or("").replace_all_many(["\"","'","\\u003c","<","\\u003e",">"]) }

                    - mapping: 'root = {}'

                - archive:
                    format: 'json_array'

                - resource: 'submit'

                - sleep:
                    duration: "0.1s"

            - processors:
                - log:
                    message: '${! "Ingest incomplete: " + metadata("ingest").source + " failed to complete listing records." }'

                - mapping: |
                    meta resumptionToken = null

        - catch: []

rate_limit_resources:
  - label: 'rl__oai_pmh'
    local:
      count: 60
      interval: '1m'
