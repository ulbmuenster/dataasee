processor_resources:
  - label: 'interconnect'
    arcadedb:
      host: '${DB_HOST}'
      port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
      endpoint: 'command'
      database: '${DB_NAME}'
      username: '${DB_USER}'
      password: '${DB_PASS}'
      retries: 0
      request: |
        root.language = "sqlscript"
        root.awaitResponse = false
        root.command = """
          CONSOLE.log 'Starting interconnect!\n';
          LET $new = SELECT @rid FROM metadata WHERE visited = false;
          LET $progress = 0;
          BEGIN;
          FOREACH( $src IN $new.@rid ) {

            LET $related = $src.related;

            IF( $related <> {} ) {
              LET $relatee = SELECT @rid, identifiers.data AS ids FROM metadata WHERE identifiers.data CONTAINSANY unionall($related.values());

              IF( $related CONTAINSKEY 'isRelatedTo' ) {
                LET $dst = $relatee[ids CONTAINSANY $related.isRelatedTo].@rid;
                CREATE EDGE isRelatedTo FROM $src TO $dst IF NOT EXISTS;
              }

              IF( $related CONTAINSKEY 'isNewVersionOf' ) {
                LET $dst = $relatee[ids CONTAINSANY $related.isNewVersionOf].@rid;
                CREATE EDGE isNewVersionOf FROM $src TO $dst IF NOT EXISTS;
              }

              IF( $related CONTAINSKEY 'isDerivedFrom' ) {
                LET $dst = $relatee[ids CONTAINSANY $related.isDerivedFrom].@rid;
                CREATE EDGE isDerivedFrom FROM $src TO $dst IF NOT EXISTS;
              }

              IF( $related CONTAINSKEY 'isPartOf' ) {
                LET $dst = $relatee[ids CONTAINSANY $related.isPartOf].@rid;
                CREATE EDGE isPartOf FROM $src TO $dst IF NOT EXISTS;
              }

              IF( $src.related CONTAINSKEY 'commonExpression' ) {
                LET $dst = $relatee[ids CONTAINSANY $src.related.commonExpression].@rid;
                CREATE EDGE commonExpression FROM $src TO $dst IF NOT EXISTS;
              }
            }

            LET $identifiers = $src.identifiers;

            IF( $identifiers IS NOT NULL ) {
              LET $dst = SELECT @rid FROM metadata WHERE (@rid <> $src) AND (identifiers.data CONTAINSANY $identifiers.data);
              CREATE EDGE commonManifestation FROM $src TO $dst.@rid IF NOT EXISTS;
            }

            UPDATE metadata SET visited = true WHERE @rid = $src;

            LET $progress = $progress + 1;

            IF( $progress % 1000 = 0 ) {
              COMMIT;
              CONSOLE.output $progress + ' Done!';
              BEGIN;
            }
          }
          COMMIT;
          CONSOLE.output $progress + ' Done!';
          SLEEP 5000;
          BACKUP DATABASE;
          CONSOLE.log 'Finished interconnect!\n';"""

      response: |
        root = {}
