processor_resources:
  - label: 'interconnect'
    arcadedb:
      host: '${DB_HOST}'
      port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
      endpoint: 'command'
      database: '${DB_NAME}'
      username: '${DB_USER}'
      password: '${DB_PASS}'
      retries: 0
      request: |
        root.language = "sqlscript"
        root.awaitResponse = false
        root.command = """
          CONSOLE.log 'Interconnect started!';
          LET $progress = 0;
          WHILE( true ) {
            LET $new = SELECT @rid FROM metadata WHERE visited = false LIMIT 1000;
            IF( $new.@rid = [] ) {
              BREAK;
            }
            BEGIN;
            FOREACH( $src IN $new.@rid ) {
              IF( $src.related <> {} ) {

                IF( $src.related CONTAINSKEY 'isRelatedTo' ) {
                  LET $dst = SELECT @rid FROM metadata WHERE selfies CONTAINSANY $src.related.isRelatedTo;
                  CREATE EDGE isRelatedTo FROM $src TO $dst.@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'isNewVersionOf' ) {
                  LET $dst = SELECT @rid FROM metadata WHERE selfies CONTAINSANY $src.related.isNewVersionOf;
                  CREATE EDGE isNewVersionOf FROM $src TO $dst.@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'isDerivedFrom' ) {
                  LET $dst = SELECT @rid FROM metadata WHERE selfies CONTAINSANY $src.related.isDerivedFrom;
                  CREATE EDGE isDerivedFrom FROM $src TO $dst.@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'isPartOf' ) {
                  LET $dst = SELECT @rid FROM metadata WHERE selfies CONTAINSANY $src.related.isPartOf;
                  CREATE EDGE isPartOf FROM $src TO $dst.@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'hasPart' ) {
                  LET $dst = SELECT @rid FROM metadata WHERE selfies CONTAINSANY $src.related.hasPart;
                  CREATE EDGE hasPart FROM $src TO $dst.@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'commonExpression' ) {
                  LET $dst = SELECT @rid FROM metadata WHERE selfies CONTAINSANY $src.related.commonExpression;
                  CREATE EDGE commonExpression FROM $src TO $dst.@rid IF NOT EXISTS;
                }
              }

              IF( $src.selfies <> [] ) {
                LET $dst = SELECT @rid FROM metadata WHERE (@rid <> $src) AND (selfies CONTAINSANY $src.selfies);
                CREATE EDGE commonManifestation FROM $src TO $dst.@rid IF NOT EXISTS;
              }

              LET $progress = $progress + 1;
            }
            UPDATE metadata SET visited = true WHERE @rid IN $new.@rid;
            COMMIT;
            IF( $progress % 10000 == 0) {
              CONSOLE.log $progress + ' Done!';
            }
          }
          SLEEP 3000;
          BACKUP DATABASE;
          CONSOLE.log 'Interconnect finished!\n';"""

      response: |
        root = {}
