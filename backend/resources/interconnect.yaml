processor_resources:
  - label: 'interconnect'
    arcadedb:
      host: '${DB_HOST}'
      port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
      endpoint: 'command'
      database: '${DB_NAME}'
      username: '${DB_USER}'
      password: '${DB_PASS}'
      retries: 0
      request: |
        root.language = "sqlscript"
        root.awaitResponse = false
        root.command = """
          BACKUP DATABASE;
          IF( $interlock <=> true ) {
            CONSOLE.log 'Interconnect ongoing.';
            RETURN;
          }
          CONSOLE.log 'Interconnect started!';
          SET GLOBAL $interlock = true;
          LET $progress = 0;
          WHILE( true ) {
            LET $batch = (SELECT @rid, related, identifiers.name AS ids FROM Metadata WHERE visited = false LIMIT 10000);
            IF( $batch = [] ) {
              BREAK;
            }
            BEGIN;
            FOREACH( $src IN $batch ) {
              LET $all = $src.related.isRelatedTo || $src.related.isNewVersionOf || $src.related.isDerivedFrom || $src.related.isPartOf || $src.related.hasPart || $src.related.isDescribedBy || $src.related.commonExpression || $src.ids;
              LET $dst = SELECT @rid, identifiers.name AS ids FROM Metadata WHERE identifiers.name CONTAINSANY $all;

              IF( $src.related <> {} ) {
                IF( $src.related CONTAINSKEY 'isRelatedTo' ) {
                  CREATE EDGE isRelatedTo FROM $src.@rid TO $dst[ids CONTAINSANY $src.related.isRelatedTo].@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'isNewVersionOf' ) {
                  CREATE EDGE isNewVersionOf FROM $src.@rid TO $dst[ids CONTAINSANY $src.related.isNewVersionOf].@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'isDerivedFrom' ) {
                  CREATE EDGE isDerivedFrom FROM $src.@rid TO $dst[ids CONTAINSANY $src.related.isDerivedFrom].@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'isPartOf' ) {
                  CREATE EDGE isPartOf FROM $src.@rid TO $dst[ids CONTAINSANY $src.related.isPartOf].@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'hasPart' ) {
                  CREATE EDGE hasPart FROM $src.@rid TO $dst[ids CONTAINSANY $src.related.hasPart].@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'isDescribedBy' ) {
                  CREATE EDGE isDescribedBy FROM $src.@rid TO $dst[ids CONTAINSANY $src.related.isDescribedBy].@rid IF NOT EXISTS;
                }

                IF( $src.related CONTAINSKEY 'commonExpression' ) {
                  CREATE EDGE commonExpression FROM $src.@rid TO $dst[ids CONTAINSANY $src.related.commonExpression].@rid IF NOT EXISTS;
                }
              }

              IF( $src.ids <> [] ) {
                CREATE EDGE commonManifestation FROM $src.@rid TO $dst[(ids CONTAINSANY $src.ids) AND (@rid <> $src.@rid)].@rid IF NOT EXISTS;
              }
            }
            UPDATE $batch.@rid SET visited = true;
            COMMIT;

            LET $progress = $progress + $batch.size();
            CONSOLE.log $progress + ' Done!';
          }
          SLEEP 3000;
          BACKUP DATABASE;
          SET GLOBAL $interlock = null;
          CONSOLE.log 'Interconnect finished!\n';"""

      response: |
        root = {}
