processor_resources:
  - label: 'format_lido'
    try:
      - label: 'format_lido__get_payload'
        mapping: 'root = this.lido'

      - label: 'format_lido__patch_sourceid'
        mapping: 'meta sourceid = if metadata("sourceid") == null { this.lidoRecID."#text".catch(deleted()) }'

      - label: 'format_lido__parser_workflow'
        workflow:
          meta_path: ''
          order:
            - - 'rawMetadata'
              - 'rawFormat'
              - 'title'
              - 'publicationYear'
              - 'publisher'
              - 'resourceType'
              - 'version'
              - 'license'
              - 'language'
              - 'keywords'
              - 'description'
              - 'rights'
              - 'creators'
              - 'synonyms'
              - 'identifiers'
              - 'subjects'
              - 'relatedItems'
              - 'related'
            - - 'identifiers_1'
              - 'subjects_1'
            - - 'gather'
          branches:

            # Raw String

            'rawMetadata':
              request_map: 'root = this.without("dataasee")'
              processors:
                - mapping: |
                    root.rawMetadata = { "lido": this }.format_xml(no_indent: true).string()
              result_map: 'root.dataasee.rawMetadata = this.rawMetadata'

            # Raw Format

            'rawFormat':
              request_map: 'root = {}'
              processors:
                - mapping: |
                    root.rawFormat = "lido+xml"
              result_map: 'root.dataasee.rawFormat = this.rawFormat'

            # Filtered or First String

            'title':
              request_map: 'root = this.descriptiveMetadata.objectIdentificationWrap.titleWrap.titleSet.array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let preferred = this
                    let preferred = this.filter(x -> x."-pref" == "http://terminology.lido-schema.org/lido00169").not_empty().catch($preferred)
                    let preferred = $preferred.filter(x -> x.appellationValue.array().any(y -> y."-pref" == "http://terminology.lido-schema.org/lido00169")).not_empty().catch($preferred)
                    let preferred = $preferred.0.appellationValue.array()
                    let preferred = $preferred.filter(x -> x."-pref" == "http://terminology.lido-schema.org/lido00169").not_empty().catch($preferred)
                    let preferred = $preferred.filter(x -> x."-lang" == "en").not_empty().catch($preferred).0
                    root.title = $preferred."#text" | $preferred.string()
              result_map: 'root.dataasee.title = this.title'

            'publicationYear':
              request_map: 'root = this.descriptiveMetadata.eventWrap.eventSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let displayEvent = this.filter(x -> x.exists("displayEvent")).0
                    let eventDate = this.filter(x -> x.exists("event.eventDate"))
                    let eventDate = $eventDate.filter(x -> (x.event.eventType.Concept."-about" == "http://terminology.lido-schema.org/lido00007") ||
                                                           (x.event.eventType.conceptID.array().filter(y -> y."-type" == "http://terminology.lido-schema.org/lido00007").length() > 0) ||
                                                           (x.event.eventType.term.array().filter(y -> y."#text".or(y.string()).lowercase() == "production").length() > 0) )
                    let eventDate = $eventDate.0.event.eventDate
                    let first = match { $eventDate.date.earliestDate != null => $eventDate.date.earliestDate,
                                        $eventDate.date.latestDate != null   => $eventDate.date.latestDate,
                                        $eventDate.displayDate != null       => $eventDate.displayDate,
                                        $displayEvent.displayEvent != null   => $displayEvent.displayEvent,
                                        _                                    => null }
                    root.publicationYear = $first."#text" | $first
              result_map: 'root.dataasee.publicationYear = this.publicationYear | deleted()'

            'publisher':
              request_map: 'root = this.descriptiveMetadata.objectIdentificationWrap.repositoryWrap.repositorySet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let displayRepository = this.filter(x -> x.exists("displayRepository")).not_empty().0.displayRepository.array().catch([])
                    let repositoryName = this.filter(x -> x.exists("repositoryName.legalBodyName") && x.repositoryName.legalBodyName.array().any(y -> y.exists("appellationValue")))
                    let first = $repositoryName.0.repositoryName.legalBodyName.array().filter(x -> x.exists("appellationValue")).not_empty().0.appellationValue.array().catch($displayRepository)
                    let first = $first.filter(x -> x."-lang".re_match("[Ee][nN][Gg]?")).not_empty().catch($first).not_empty().0.catch(null)
                    root.publisher = $first."#text" | $first
              result_map: 'root.dataasee.publisher = this.publisher.not_null().catch(deleted())'

            'resourceType':  # TODO
              request_map: 'root = this.category.array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.resourceType = null
              result_map: 'root.dataasee.resourceType = this.resourceType'

            'version':
              request_map: 'root = this.descriptiveMetadata.objectIdentificationWrap.displayStateEditionWrap.displayEdition.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this
                    let first = this.filter(x -> x."-lang".re_match("[Ee][nN][Gg]?")).not_empty().catch($first).0
                    root.version = $first."#text" | $first
              result_map: 'root.dataasee.version = this.version | deleted()'

            'license':
              request_map: 'root = this.administrativeMetadata.rightsWorkWrap.rightsWorkSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.0.rightsType.not_null().array().not_empty().0.catch(null)
                    let first = $first.term.not_null().array().not_empty().0.catch($first.conceptID.not_null().array().not_empty().0.catch(null))
                    root.license = $first."#text" | $first
              result_map: 'root.dataasee.license = this.license | deleted()'

            'language':
              request_map: 'root = this.descriptiveMetadata.objectClassificationWrap.classificationWrap.classification.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let first = this.filter(x -> x.exists("term") && x.exists("-type") && x."-type".re_match("[sS]prache|[Ll]anguage")).0.term.array().0.catch(null)
                    root.language = $first."#text" | $first
              result_map: 'root.dataasee.language = this.language | deleted()'

            # Concatenated String

            'description':
              request_map: 'root = this.descriptiveMetadata.objectIdentificationWrap.objectDescriptionWrap.objectDescriptionSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = " ¶ "
                    root.description = this.filter(x -> x.exists("descriptiveNoteValue")).map_each(x -> x.descriptiveNoteValue.array().map_each(y -> y."#text" | y.string())).flatten().join($sep)
              result_map: 'root.dataasee.description = this.description'

            'rights':
              request_map: 'root = this.administrativeMetadata.rightsWorkWrap.not_null().rightsWorkSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let sep = " ¶ "
                    root.rights = this.filter(x -> x.exists("creditLine")).map_each(x -> x.creditLine.array().map_each(y -> y."#text" | y.string())).flatten().join($sep)
              result_map: 'root.dataasee.rights = this.rights.not_empty().catch(deleted())'

            # Array

            'keywords':
              request_map: 'root = this.descriptiveMetadata.objectClassificationWrap.objectWorkTypeWrap.objectWorkType.array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.keywords = this.map_each(x -> x.term.array().map_each(y -> y."#text" | y.string())).flatten()
              result_map: 'root.dataasee.keywords = this.keywords'

            'creators':
              request_map: 'root = this.descriptiveMetadata.eventWrap.eventSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let eventActor = this.filter(x -> x.exists("event.eventActor"))
                    let eventActor = $eventActor.filter(x -> (x.event.eventType.Concept."-about" == "http://terminology.lido-schema.org/lido00007") ||
                                                             (x.event.eventType.conceptID.array().filter(y -> y."-type" == "http://terminology.lido-schema.org/lido00007").length() > 0) ||
                                                             (x.event.eventType.term.array().filter(y -> y."#text".or(y.string()).lowercase() == "production").length() > 0) )
                    let eventActor = $eventActor.not_empty().0.event.eventActor.array().catch([])
                    let creators = $eventActor.map_each(x -> match { x.exists("displayActorInRole")                              => x.displayActorInRole.array() ,
                                                                     x.exists("actorInRole.actor.nameActorSet.appellationValue") => x.actorInRole.actor.nameActorSet.appellationValue.array() })
                    let creators = $creators.map_each(x -> x.filter(y -> y."-lang".re_match("[Ee][nN][Gg]?")).not_empty().catch(x).0)
                    root.creators = $creators.map_each(x -> { "name": x."#text" | x })
              result_map: 'root.dataasee.creators = this.creators.not_empty().catch(deleted())'

            'synonyms':
              request_map: 'root = this.descriptiveMetadata.objectIdentificationWrap.titleWrap.titleSet.array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.synonyms = this.map_each(x -> x.appellationValue.array().map_each(y -> { "name": y."#text" | y.string(),
                                                                                                  "data": "alternative" })).flatten()
              result_map: 'root.dataasee.synonyms = this.synonyms.not_empty().catch(deleted())'

            'identifiers':
              request_map: 'root = this.lidoRecID.array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.identifiers = this.map_each(x -> { "name": x."#text" | x.string(),
                                                            "data": "lidoRecId" })
              result_map: 'root.dataasee.identifiers = this.identifiers'

            'subjects':
              request_map: 'root = this.descriptiveMetadata.objectRelationWrap.subjectWrap.subjectSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let concepts = this.filter(x -> x.exists("subject.subjectConcept"))
                    let concepts = $concepts.map_each(x -> x.subject.subjectConcept.array().map_each(y -> { "name": y.term.array(),
                                                                                                            "data": y.conceptID.array() })).flatten()
                    let actors = this.filter(x -> x.exists("subject.subjectActor"))
                    let actors = $actors.map_each(x -> x.subject.subjectActor.array().map_each(y -> { "name": y.actor.nameActorSet.appellationValue.array(),
                                                                                                      "data": y.actor.actorID.array() })).flatten()
                    let places = this.filter(x -> x.exists("subject.subjectPlace"))
                    let places = $places.map_each(x -> x.subject.subjectPlace.array().map_each(y -> { "name": y.place.namePlaceSet.appellationValue.array(),
                                                                                                      "data": y.place.placeID.array() })).flatten()
                    let subjects = $concepts.concat($actors).concat($places).map_each(x -> { "name": x.name.filter(y -> y."-lang".re_match("[Ee][nN][Gg]?")).not_empty().catch(x.name).0,
                                                                                             "data": x.data }).map_each(x -> x.explode("data")).flatten()
                    root.subjects = $subjects.map_each(x -> { "name": x.name."#text" | x.name,
                                                              "data": x.data."#text" | x.data })
              result_map: 'root.dataasee.subjects = this.subjects'

            'relatedItems':  # TODO name choose relatedWorkRelType.term if avail
              request_map: 'root = this.descriptiveMetadata.objectRelationWrap.relatedWorksWrap.relatedWorkSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let relatedItems = this.filter(x -> x.exists("relatedWork.object.objectWebResource"))
                    let relatedItems = $relatedItems.map_each(x -> x.relatedWork.object.objectWebResource.array().0)
                    root.relatedItems = $relatedItems.map_each(x -> { "name": "related",
                                                                        "data": x."#text" | x })
              result_map: 'root.dataasee.relatedItems = this.relatedItems.not_empty().catch(deleted())'

            # Object

            'related':
              request_map: 'root = this.descriptiveMetadata.objectRelationWrap.relatedWorksWrap.relatedWorkSet.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let relations = this.filter(x -> x.exists("relatedWork.object.objectID")).map_each(x -> x.relatedWork.object.objectID.array()).flatten().map_each(x -> x."#text" | x)
                    root.related = $relations.fold({},x -> x.tally.merge({ "isRelatedTo": x.value }))
              result_map: 'root.dataasee.related = this.related.not_empty().catch(deleted())'

            # Additionals

            'identifiers_1':
              request_map: 'root = this.objectPublishedID.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    root.identifiers = this.map_each(x -> { "name": x."#text" })
              result_map: 'root.dataasee.identifiers = root.dataasee.identifiers.or([]).concat(this.identifiers).not_empty().catch(deleted())'

            'subjects_1':
              request_map: 'root = this.descriptiveMetadata.objectClassificationWrap.classificationWrap.classification.not_null().array().not_empty().catch(deleted())'
              processors:
                - mapping: |
                    let subjects = this.map_each(x -> { "name": x.term.array().filter(y -> y."-lang".re_match("[Ee][nN][Gg]?")).not_empty().catch(x.term.array()).0,
                                                        "data": x.conceptID.array() }).map_each(x -> x.explode("data")).flatten()
                    root.subjects = $subjects.map_each(x -> { "name": x.name."#text" | x.name,
                                                              "data": x.data."#text" | x.data })
              result_map: 'root.dataasee.subjects = root.dataasee.subjects.or([]).concat(this.subjects).not_empty().catch(deleted())'

            # Finalize

            'gather':
              request_map: 'root = this'
              processors:
                - mutation: |
                    root.dataasee.synonyms = this.dataasee.synonyms.or([]).filter(x -> x.data != this.dataasee.name)
              result_map: 'root = this.dataasee'
