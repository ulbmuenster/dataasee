processor_resources:
  - label: 'handler_sources'
    processors:
      - cached:
          cache: 'global_cache'
          key: 'sources'
          processors:
            - label: 'handler_sources__arcadedb_query'
              arcadedb:
                host: '${DB_HOST}'
                port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
                endpoint: 'query'
                database: '${DB_NAME}'
                username: '${DB_USER}'
                password: '${DB_PASS}'
                request: |
                  root.language = "sql"
                  root.command = """SELECT data AS source, name AS date, $fmt[0].metadataFormat.ifnull("dataasee") AS format FROM sources
                                    LET fmt = (SELECT metadataFormat FROM metadata WHERE source = $parent.$current.@rid LIMIT 1)"""
                response: |
                  root.data.type = "support"
                  root.data.id = timestamp_unix().string()
                  root.data.attributes.sources = this.result

      - catch:
          - mapping: |
              meta status = "500"
              root.errors = [ { "title": "Server Error: Internal Server Error",
                                "detail": "Database error." } ]
