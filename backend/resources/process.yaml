processor_resources:
  - label: 'process'
    mapping: |
      root = this
      root.rawChecksum = "sha256:" + this.rawMetadata.not_empty().hash("sha256").encode("hex").catch(null)
      root.recordId = "ni:" + (metadata("ingest").source.string() + "/" + metadata("ingest").format.string() + "/" + metadata("sourceid").or(this.publisher.string()) + "/" + this.publicationYear.string() + "/" + this.title.string() + "/" + this.version.string()).hash("sha256").encode("base64rawurl")
      root.source = metadata("source_rid")
      root.sourceRights = metadata("ingest").rights.or("not known")
      root.dataSteward = metadata("ingest").steward.or("dataasee admin")
      root.schemaVersion = 1
      root.visited = false
