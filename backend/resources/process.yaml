# Language: Benthos YAML, Project: DatAasee, License: MIT, Author: Christian Himpe

processor_resources:
  - label: 'process'
    mapping: |
      root = this
      root.metadataFormat = metadata("ingest").format.or(deleted())
      root.metadataChecksum = this.rawMetadata.hash("md5").catch(deleted())
      root.recordId = (metadata("ingest").source.string() + "/" + metadata("ingest").format.string() + "/" + metadata("sourceid").or(this.publisher.string()) + "/" + this.publicationYear.string() + "/" + this.name.string() + "/" + this.version.string()).hash("xxhash64").encode("base64rawurl")
      root.source = metadata("ingest").source.or("dataasee")
      root.dataSteward = metadata("ingest").steward.or("dataasee admin")
      root.schemaVersion = 1
      root.numberViews = 0                                     # TODO: Remove once 'APPLY DEFAULTS' is implemented in ArcadeDB
      root.createdAt = now().ts_format("2006-01-02 15:04:05")  # TODO: Remove once 'APPLY DEFAULTS' is implemented in ArcadeDB
      root.visited = false
