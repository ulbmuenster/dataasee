processor_resources:
  - label: 'normalize'
    try:
      - mutation: |
          map prep_str {
            root = this.or("").string().trim().replace_all_many(["\\","\\\\","'","\\'","\"","\\\"",";","\u037E","--","\u2013"])
          }

          map prep_uri {
            let url = this.or("").string().trim().replace_all_many(["\\","%5C","'","%27","\"","%22",";","%3B"," ","%20"])
            root = if $url.re_match("^(http)[s]?(:\\/\\/)[^\\s\\/$.?#].[^\\s]*$") && $url.length() < 4096 { $url } else { null }
          }

          map id2url {
            root = match this.or("").string() { this.has_prefix("http://dx.doi.org/") => "https://doi.org/" + this.lowercase().trim_prefix("http://dx.doi.org/"),
                                                this.has_prefix("http://doi.org/")    => "https://doi.org/" + this.lowercase().trim_prefix("http://doi.org/"),
                                                this.lowercase().has_prefix("doi:")   => "https://doi.org/" + this.lowercase().trim_prefix("doi:"),
                                                this.lowercase().has_prefix("orcid:") => "https://orcid.org/" + this.lowercase().trim_prefix("orcid:"),
                                                this.lowercase().has_prefix("arxiv:") => "https://arxiv.org/abs/" + this.lowercase().trim_prefix("arxiv:"),
                                                _                                     => this
                                              }
          }

          map tiny_str {
            root = if this.length() < 256 { this } else { this.slice(0,254) + "…" }
          }

          map small_str {
            root = if this.length() < 4096 { this } else { this.slice(0,4094) + "…" }
          }

          map text_str {
            root = if this.length() < 65536 { this } else { this.slice(0,65534) + "…" }
          }

          map prune {
            root = this.not_empty().catch(deleted())
          }

          root.categories = this.categories.or([]).slice(0,4).map_each(x -> x.apply("prep_str").apply("tiny_str"))

          root.keywords = this.keywords.or("").split(",").map_each(x -> x.trim()).filter(x -> x != "").join(",").apply("prep_str").apply("tiny_str")

          root.name = if this.name.type() == "string" && this.name.length() > 0 { this.name.apply("prep_str").apply("tiny_str") } else { "" }

          root.creators = if this.creators.type() == "array" && this.creators.length() > 0 { this.creators.filter(x -> x.name != null).map_each(x -> { "name": x.name.apply("prep_str").apply("tiny_str"),
                                                                                                                                                       "data": if x.exists("data") { x.data.apply("id2url").apply("prep_uri") | deleted() } else { deleted() },
                                                                                                                                                       "@type": "pair" }).not_empty().catch(null) } else { null }

          root.publicationYear = match { this.publicationYear.type() == "number" && this.publicationYear > -10000 && this.publicationYear < 10000 => this.publicationYear,
                                         this.publicationYear.type() == "string" && this.publicationYear.length() > 0 && this.publicationYear.trim().trim_prefix("[").slice(0,4).re_match("^-?[1-9]\\d{0,3}") => this.publicationYear.trim().trim_prefix("[").re_find_all("^-?[1-9]\\d{0,3}").0.number(),
                                         _ => null }

          root.publisher = if this.publisher.type() == "string" && this.publisher.length() > 0 { this.publisher.apply("prep_str").apply("tiny_str") } else { null }

          root.resourceType = if this.resourceType.type() == "string" && this.resourceType.length() > 0 { this.resourceType.apply("prep_str").apply("tiny_str") } else { null }

          root.identifiers = if this.identifiers.type() == "array" && this.identifiers.length() > 0 { this.identifiers.map_each(x -> { "name": x.name.apply("prep_str").apply("tiny_str").lowercase(),
                                                                                                                                       "data": x.data.apply("id2url").apply("prep_str").apply("small_str"),
                                                                                                                                       "@type": "pair" }).filter(x -> x.data != "").map_each(x -> if x.data.has_prefix("https://doi.org/") { x.assign({"name":"doi"}) } else { x }).not_empty().catch(null) } else { null }

          root.synonyms = this.synonyms.or([]).map_each(x -> { "name": x.name.apply("prep_str").apply("tiny_str"),
                                                               "data": x.data.apply("prep_str").apply("small_str"),
                                                               "@type": "pair" })
          root.synonyms = if this.name.or("").length() > 255 { root.synonyms.append({ "name": "fulltitle",
                                                                                      "data": this.name.apply("prep_str").apply("small_str"),
                                                                                      "@type": "pair" }) }
          root.synonyms = root.synonyms.slice(0,256).apply("prune")

          root.language = this.language.apply("prep_str").apply("tiny_str")

          # TODO: filter subjects without URL and move to keywords?
          root.subjects = this.subjects.or([]).map_each(x -> { "name": x.name.apply("prep_str").apply("tiny_str"),
                                                               "data": if x.exists("data") { x.data.apply("prep_uri") | deleted() } else { deleted() },
                                                               "@type": "pair" }).unique(x -> x.name).slice(0,256).filter(x -> x.name != "").apply("prune")

          root.version = this.version.apply("prep_str").apply("tiny_str").apply("prune")

          root.license = this.license.apply("prep_str").apply("tiny_str").apply("prune")

          root.rights = this.rights.apply("prep_str").apply("text_str").apply("prune")

          root.project = if this.project != null { { "name": this.project.name.apply("prep_str").apply("tiny_str"),
                                                     "data": if this.project.exists("data") { this.project.data.apply("prep_uri") | deleted() } else { deleted() },
                                                     "@type": "pair" } }

          root.fundings = this.fundings.or([]).map_each(x -> { "name": x.name.apply("prep_str").apply("tiny_str"),
                                                               "data": if x.exists("data") && x.data != null { x.data.apply("prep_str").apply("small_str") } else { deleted() },
                                                               "@type": "pair" }).slice(0,256).apply("prune")

          root.description = this.description.apply("prep_str").apply("text_str")

          root.message = this.message.apply("prep_str").apply("text_str").apply("prune")

          root.externalItems = this.externalItems.or([]).map_each(x -> { "name": x.name.apply("prep_str").apply("tiny_str"),
                                                                         "data": x.data.apply("id2url").apply("prep_uri"),
                                                                         "@type": "pair" }).filter(x -> x.data != null).slice(0,256).apply("prune")

          root.rawMetadata = if root.rawMetadata != null && root.rawMetadata.length() < 1048576 { this.rawMetadata.or("").string().trim().replace_all_many(["'","\\'","\"","\\\""]) } else { "" }

          root.dataLocation = this.dataLocation.apply("id2url").apply("prep_uri").apply("prune")

          root.dataFormat = this.dataFormat.apply("prep_str").apply("tiny_str").apply("prune")

          root.related = this.related.or({}).map_each(x -> x.value.array().map_each(y -> y.apply("prep_str").apply("small_str")))

      - label: 'normalize__arcadedb_query'
        arcadedb:
          host: '${DB_HOST}'
          port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
          endpoint: 'query'
          database: '${DB_NAME}'
          username: '${DB_USER}'
          password: '${DB_PASS}'
          request: |
            root.language = "sql"
            root.params.resourcetype = this.resourceType.or("").string()
            root.params.category = this.categories.string().replace_all_many([ "[","", "]","", ",","|", "\"","" ])
            root.params.language = this.language.or("").string()
            root.params.license = this.license.or("").string()
            root.command = """SELECT $resourceType[0].@rid AS resourceType,
                                     $categories.@rid AS categories,
                                     $language[0].@rid AS language,
                                     $license[0].@rid AS license
                              LET $resourceType = (SELECT @rid
                                                   FROM resourcetypes
                                                   WHERE name ILIKE :resourcetype OR
                                                         data MATCHES '(?i).*(' + :resourcetype + ').*'),
                                  $categories = (SELECT @rid
                                                 FROM categories
                                                 WHERE name MATCHES '(?i)(' + :category + ')'),
                                  $language = (SELECT @rid
                                               FROM languages
                                               WHERE name ILIKE :language OR
                                                     data MATCHES '(?i)(|.*\\s)' + :language + '(\\s.*|)'),
                                  $license = (SELECT @rid
                                              FROM licenses
                                              WHERE name.replace('-',' ') ILIKE :license.replace('-',' ') OR
                                                    data ILIKE :license)"""
          response: |
            root.resourceType = this.result.0.resourceType | null
            root.language = this.result.0.language | deleted()
            root.license = this.result.0.license | deleted()
            root.categories = if this.result.0.categories.length() > 0 { this.result.0.categories } else { deleted() }

      - resource: 'quality'
