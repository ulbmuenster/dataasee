processor_resources:
  - label: 'handler_backup'
    processors:
      - label: 'handler_backup__arcadedb_command'
        arcadedb:
          host: '${DB_HOST}'
          port: ${DB_PORT}  # yamllint disable-line rule:quoted-strings
          endpoint: 'command'
          database: '${DB_NAME}'
          username: '${DB_USER}'
          password: '${DB_PASS}'
          retries: 0
          request: |
            root.language = "sql"
            root.command = "BACKUP DATABASE;"
          response: |
            root.data.type = "system"
            root.data.id = timestamp_unix().string()
            root.data.attributes.completed = true

      - catch:
          - mapping: |
              meta status = "500"
              root.errors = [ { "title": "Server Error: Internal Server Error",
                                "detail": "Database error." } ]
